<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="robots" content="noindex, nofollow">
    <title>Viewpoint POS - Login</title>

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://sipgnykshaxrxwdeswfc.supabase.co">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        /* ============================================================
           CSS - Complete (copy from previous version)
           ============================================================ */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6C3CE1;
            --primary-dark: #5B2FC9;
            --primary-light: #8B5CF6;
            --primary-rgb: 108, 60, 225;
            --bg-start: #0F172A;
            --bg-end: #1E293B;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-primary: #FFFFFF;
            --text-secondary: rgba(255, 255, 255, 0.65);
            --text-muted: rgba(255, 255, 255, 0.35);
            --input-bg: rgba(255, 255, 255, 0.04);
            --input-border: rgba(255, 255, 255, 0.08);
            --input-focus-border: #6C3CE1;
            --error-bg: rgba(239, 68, 68, 0.12);
            --error-border: rgba(239, 68, 68, 0.2);
            --error-text: #F87171;
            --success-bg: rgba(16, 185, 129, 0.12);
            --success-border: rgba(16, 185, 129, 0.2);
            --success-text: #34D399;
            --shadow-color: rgba(108, 60, 225, 0.3);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        html {
            -webkit-text-size-adjust: 100%;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: var(--font);
            min-height: 100vh;
            min-height: 100dvh;
            background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }

        .login-wrapper {
            display: flex;
            width: 100%;
            max-width: 1000px;
            min-height: 580px;
            border-radius: 28px;
            overflow: hidden;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.6);
            position: relative;
        }

        .brand-panel {
            flex: 1;
            background: radial-gradient(ellipse at 30% 20%, rgba(var(--primary-rgb), 0.20), transparent 70%),
                linear-gradient(135deg, var(--bg-start), #0B1120);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 48px 32px;
            text-align: center;
            position: relative;
            min-height: 360px;
        }

        .brand-panel .logo-icon {
            width: 88px;
            height: 88px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            color: #fff;
            box-shadow: 0 12px 48px var(--shadow-color);
            margin-bottom: 20px;
            flex-shrink: 0;
            transition: var(--transition);
        }

        .brand-panel h1 {
            color: var(--text-primary);
            font-size: 34px;
            font-weight: 900;
            letter-spacing: -0.5px;
            line-height: 1.2;
        }

        .brand-panel .tagline {
            color: var(--text-secondary);
            font-size: 15px;
            margin-top: 10px;
            line-height: 1.6;
            max-width: 280px;
        }

        .brand-panel .features {
            margin-top: 32px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            text-align: left;
            width: 100%;
            max-width: 280px;
        }

        .brand-panel .features .feature-item {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-secondary);
            font-size: 13px;
            line-height: 1.4;
        }

        .brand-panel .features .feature-item i {
            color: var(--primary-light);
            font-size: 15px;
            width: 22px;
            text-align: center;
            flex-shrink: 0;
        }

        .brand-panel .brand-footer {
            position: absolute;
            bottom: 24px;
            color: var(--text-muted);
            font-size: 12px;
            letter-spacing: 0.3px;
        }

        .auth-panel {
            flex: 1.3;
            padding: 44px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: rgba(255, 255, 255, 0.02);
            min-height: 360px;
        }

        .auth-panel .auth-header {
            margin-bottom: 24px;
        }

        .auth-panel .auth-header .auth-title {
            color: var(--text-primary);
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        .auth-panel .auth-header .auth-sub {
            color: var(--text-secondary);
            font-size: 14px;
            margin-top: 4px;
        }

        .method-toggle {
            display: flex;
            gap: 4px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 22px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .method-toggle button {
            flex: 1;
            padding: 10px 16px;
            border: none;
            border-radius: var(--radius-sm);
            font-family: var(--font);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            background: transparent;
            color: var(--text-secondary);
            position: relative;
        }

        .method-toggle button.active {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 4px 16px var(--shadow-color);
        }

        .method-toggle button:hover:not(.active) {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.05);
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 5px;
        }

        .form-group label i {
            margin-right: 6px;
            color: var(--text-muted);
            width: 16px;
        }

        .form-group input {
            width: 100%;
            padding: 13px 16px;
            border: 1.5px solid var(--input-border);
            border-radius: var(--radius-sm);
            font-size: 15px;
            font-family: var(--font);
            background: var(--input-bg);
            color: var(--text-primary);
            transition: var(--transition);
            -webkit-appearance: none;
            appearance: none;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--input-focus-border);
            box-shadow: 0 0 0 4px rgba(var(--primary-rgb), 0.15);
            background: rgba(255, 255, 255, 0.07);
        }

        .form-group input::placeholder {
            color: var(--text-muted);
        }

        .form-group input.error {
            border-color: #EF4444;
            box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.1);
        }

        .pin-dots {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin: 6px 0 28px;
            min-height: 24px;
        }

        .pin-dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.06);
            border: 2px solid rgba(255, 255, 255, 0.06);
            transition: var(--transition);
            flex-shrink: 0;
        }

        .pin-dot.filled {
            background: var(--primary);
            border-color: var(--primary);
            transform: scale(1.08);
            box-shadow: 0 0 20px var(--shadow-color);
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            max-width: 320px;
            margin: 0 auto;
        }

        .key {
            aspect-ratio: 1 / 1;
            border: none;
            border-radius: var(--radius);
            font-family: var(--font);
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.06);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            position: relative;
            min-width: 56px;
            min-height: 56px;
        }

        .key:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-1px);
        }

        .key:active {
            transform: scale(0.93);
            background: rgba(255, 255, 255, 0.18);
        }

        .key.action {
            background: transparent;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .key.action:hover {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-primary);
        }

        .key.enter {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: #fff;
            box-shadow: 0 4px 20px var(--shadow-color);
        }

        .key.enter:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px var(--shadow-color);
        }

        .key.enter svg {
            width: 28px;
            height: 28px;
            stroke: #fff;
            stroke-width: 2.5;
            fill: none;
        }

        .key:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

        .form-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 4px 0 20px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .form-row .checkbox-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            font-size: 13px;
            cursor: pointer;
        }

        .form-row .checkbox-wrap input[type="checkbox"] {
            width: 17px;
            height: 17px;
            accent-color: var(--primary);
            cursor: pointer;
            flex-shrink: 0;
            margin: 0;
        }

        .form-row .forgot-link {
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            transition: var(--transition);
            background: none;
            border: none;
            cursor: pointer;
            font-family: var(--font);
        }

        .form-row .forgot-link:hover {
            color: var(--primary-light);
        }

        .btn-primary {
            width: 100%;
            padding: 14px 20px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 15px;
            font-weight: 700;
            font-family: var(--font);
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: #fff;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 20px var(--shadow-color);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            position: relative;
            min-height: 52px;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 36px var(--shadow-color);
        }

        .btn-primary:active:not(:disabled) {
            transform: scale(0.98);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-primary .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2.5px solid rgba(255, 255, 255, 0.25);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            flex-shrink: 0;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .alert {
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
            border: 1px solid transparent;
            line-height: 1.5;
            animation: slideDown 0.25s ease-out;
        }

        .alert.error {
            display: block;
            background: var(--error-bg);
            border-color: var(--error-border);
            color: var(--error-text);
        }

        .alert.success {
            display: block;
            background: var(--success-bg);
            border-color: var(--success-border);
            color: var(--success-text);
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 820px) {
            .login-wrapper {
                flex-direction: column;
                max-width: 460px;
                min-height: auto;
                border-radius: 20px;
            }

            .brand-panel {
                padding: 28px 24px 24px;
                min-height: auto;
            }

            .brand-panel .features {
                display: none;
            }

            .brand-panel .brand-footer {
                position: static;
                margin-top: 16px;
            }

            .brand-panel .logo-icon {
                width: 68px;
                height: 68px;
                font-size: 30px;
            }

            .brand-panel h1 {
                font-size: 26px;
            }

            .auth-panel {
                padding: 24px 24px 32px;
                min-height: auto;
            }

            .keypad {
                max-width: 280px;
                gap: 10px;
            }

            .key {
                font-size: 24px;
                min-width: 48px;
                min-height: 48px;
            }
        }

        @media (max-width: 400px) {
            .auth-panel {
                padding: 18px 16px 24px;
            }

            .keypad {
                max-width: 240px;
                gap: 8px;
            }

            .key {
                font-size: 20px;
                min-width: 40px;
                min-height: 40px;
            }

            .form-row {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }

            .method-toggle button {
                font-size: 12px;
                padding: 8px 12px;
            }
        }
    </style>
</head>
<body>

    <div class="login-wrapper">

        <!-- Brand Panel -->
        <div class="brand-panel" role="banner">
            <div class="logo-icon" aria-hidden="true"><i class="fas fa-store"></i></div>
            <h1>Viewpoint</h1>
            <p class="tagline">Complete Point of Sale for Butcheries &amp; Restaurants</p>
            <div class="features" role="list">
                <div class="feature-item" role="listitem"><i class="fas fa-check-circle" aria-hidden="true"></i> Inventory Management</div>
                <div class="feature-item" role="listitem"><i class="fas fa-check-circle" aria-hidden="true"></i> Sales &amp; Analytics</div>
                <div class="feature-item" role="listitem"><i class="fas fa-check-circle" aria-hidden="true"></i> Multi-User Role Support</div>
                <div class="feature-item" role="listitem"><i class="fas fa-check-circle" aria-hidden="true"></i> Real-time Sync</div>
            </div>
            <div class="brand-footer">&copy; 2026 Viewpoint POS</div>
        </div>

        <!-- Auth Panel -->
        <div class="auth-panel" role="main">

            <div class="auth-header">
                <div class="auth-title">Welcome back</div>
                <div class="auth-sub" id="authSub">Sign in to your account</div>
            </div>

            <!-- Method Toggle -->
            <div class="method-toggle" role="tablist">
                <button class="active" id="pinTab" onclick="switchMethod('pin')" role="tab">
                    <i class="fas fa-keypad" aria-hidden="true"></i> PIN
                </button>
                <button id="emailTab" onclick="switchMethod('email')" role="tab">
                    <i class="fas fa-envelope" aria-hidden="true"></i> Email
                </button>
            </div>

            <!-- Alert -->
            <div id="loginAlert" class="alert" role="alert" aria-live="polite"></div>

            <!-- Form -->
            <form id="loginForm" autocomplete="off" novalidate>

                <!-- PIN Pane -->
                <div id="pinPane" role="tabpanel">
                    <!-- Email field for PIN login -->
                    <div class="form-group">
                        <label for="pinEmail"><i class="fas fa-envelope" aria-hidden="true"></i> Email Address</label>
                        <input type="email" id="pinEmail" placeholder="you@example.com" autocomplete="username" spellcheck="false">
                    </div>

                    <div class="pin-dots" id="pinDots" aria-label="PIN entry dots">
                        <div class="pin-dot" data-i="0"></div>
                        <div class="pin-dot" data-i="1"></div>
                        <div class="pin-dot" data-i="2"></div>
                        <div class="pin-dot" data-i="3"></div>
                        <div class="pin-dot" data-i="4"></div>
                        <div class="pin-dot" data-i="5"></div>
                    </div>

                    <div class="keypad" role="group" aria-label="PIN keypad">
                        <button type="button" class="key" onclick="pinPress('1')" aria-label="1">1</button>
                        <button type="button" class="key" onclick="pinPress('2')" aria-label="2">2</button>
                        <button type="button" class="key" onclick="pinPress('3')" aria-label="3">3</button>
                        <button type="button" class="key" onclick="pinPress('4')" aria-label="4">4</button>
                        <button type="button" class="key" onclick="pinPress('5')" aria-label="5">5</button>
                        <button type="button" class="key" onclick="pinPress('6')" aria-label="6">6</button>
                        <button type="button" class="key" onclick="pinPress('7')" aria-label="7">7</button>
                        <button type="button" class="key" onclick="pinPress('8')" aria-label="8">8</button>
                        <button type="button" class="key" onclick="pinPress('9')" aria-label="9">9</button>
                        <button type="button" class="key action" onclick="pinBackspace()" aria-label="Delete last digit">
                            <i class="fas fa-delete-left" aria-hidden="true"></i>
                        </button>
                        <button type="button" class="key" onclick="pinPress('0')" aria-label="0">0</button>
                        <button type="button" class="key enter" id="pinEnter" onclick="submitPin()" aria-label="Sign in with PIN">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2.5" fill="none"/></svg>
                        </button>
                    </div>

                    <input type="hidden" name="login_method" value="pin">
                    <input type="hidden" name="pin" id="pinInput" value="">
                </div>

                <!-- Email Pane -->
                <div id="emailPane" class="hidden" role="tabpanel">
                    <div class="form-group">
                        <label for="emailInput"><i class="fas fa-envelope" aria-hidden="true"></i> Email Address</label>
                        <input type="email" id="emailInput" placeholder="you@example.com" autocomplete="username" spellcheck="false">
                    </div>
                    <div class="form-group">
                        <label for="passwordInput"><i class="fas fa-lock" aria-hidden="true"></i> Password</label>
                        <input type="password" id="passwordInput" placeholder="Enter your password" autocomplete="current-password">
                    </div>
                    <div class="form-row">
                        <label class="checkbox-wrap">
                            <input type="checkbox" name="remember" id="remember">
                            Remember me
                        </label>
                        <a href="reset-password.html" class="forgot-link">Forgot password?</a>
                    </div>
                    <input type="hidden" name="login_method" value="email">
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-primary" id="loginBtn">
                    <span id="btnText"><i class="fas fa-sign-in-alt" aria-hidden="true"></i> Sign In</span>
                    <span id="btnSpinner" class="spinner" style="display:none;" aria-hidden="true"></span>
                </button>
            </form>
        </div>
    </div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>

    (function() {
        'use strict';

        // ============================================================
        // CONFIGURATION
        // ============================================================
        const CONFIG = {
            SUPABASE_URL: 'https://sipgnykshaxrxwdeswfc.supabase.co',
            SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNpcGdueWtzaGF4cnh3ZGVzd2ZjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4OTA2MzMsImV4cCI6MjEwMjQ2NjYzM30.xJtq_3jNMLnXCyVSurdIuUnrlmZEyMWNO1-Azk_4k2E',
            PIN_MIN: 4,
            PIN_MAX: 6,
            SESSION_KEY: 'viewpoint_session',
            REDIRECT_MAP: {
                1: 'admin-dashboard.html',

            },
            DEFAULT_REDIRECT: 'admin-dashboard.html'
        };

        // ============================================================
        // STATE
        // ============================================================
        let state = {
            pinValue: '',
            currentMethod: 'pin',
            isSubmitting: false,
            supabaseClient: null
        };

        // ============================================================
        // DOM REFS
        // ============================================================
        const DOM = {};

        function cacheDom() {
            DOM.pinInput = document.getElementById('pinInput');
            DOM.pinDots = document.querySelectorAll('#pinDots .pin-dot');
            DOM.pinPane = document.getElementById('pinPane');
            DOM.emailPane = document.getElementById('emailPane');
            DOM.emailInput = document.getElementById('emailInput');
            DOM.pinEmail = document.getElementById('pinEmail');
            DOM.passwordInput = document.getElementById('passwordInput');
            DOM.loginBtn = document.getElementById('loginBtn');
            DOM.btnText = document.getElementById('btnText');
            DOM.btnSpinner = document.getElementById('btnSpinner');
            DOM.alertEl = document.getElementById('loginAlert');
            DOM.authSub = document.getElementById('authSub');
            DOM.pinTab = document.getElementById('pinTab');
            DOM.emailTab = document.getElementById('emailTab');
            DOM.pinEnter = document.getElementById('pinEnter');
            DOM.loginForm = document.getElementById('loginForm');
            DOM.remember = document.getElementById('remember');
        }

        // ============================================================
        // UTILITY
        // ============================================================
        function getErrorMessage(error) {
            if (typeof error === 'string') return error;
            if (error instanceof Error) return error.message;
            if (error && typeof error === 'object' && 'message' in error) return String(error.message);
            return 'An unexpected error occurred. Please try again.';
        }

        // ✅ FIXED: Browser-compatible logging
        function secureLog(message, data) {
            const isDev = 
                window.location.hostname === 'localhost' ||
                window.location.hostname === '127.0.0.1' ||
                window.location.hostname.includes('.local');
            
            if (console && isDev) {
                console.log(`[Viewpoint] ${message}`, data || '');
            }
        }

        // ============================================================
        // PIN LOGIC
        // ============================================================
        function renderDots() {
            DOM.pinDots.forEach((dot, i) => {
                dot.classList.toggle('filled', i < state.pinValue.length);
            });
        }

        function pinPress(n) {
            if (state.isSubmitting) return;
            if (state.pinValue.length >= CONFIG.PIN_MAX) return;

            state.pinValue += n;
            DOM.pinInput.value = state.pinValue;
            renderDots();

            if (state.pinValue.length === CONFIG.PIN_MIN) {
                setTimeout(submitPin, 200);
            }
        }

        function pinBackspace() {
            if (state.isSubmitting) return;
            state.pinValue = state.pinValue.slice(0, -1);
            DOM.pinInput.value = state.pinValue;
            renderDots();
        }

        function submitPin() {
            if (state.isSubmitting) return;
            if (state.pinValue.length < CONFIG.PIN_MIN) {
                showAlert('Please enter at least ' + CONFIG.PIN_MIN + ' digits.', 'error');
                return;
            }
            DOM.loginForm.dispatchEvent(new Event('submit'));
        }

        // ============================================================
        // KEYBOARD SUPPORT
        // ============================================================
        document.addEventListener('keydown', function(e) {
            if (state.currentMethod !== 'pin') return;
            if (e.key >= '0' && e.key <= '9') {
                pinPress(e.key);
                e.preventDefault();
            } else if (e.key === 'Backspace') {
                pinBackspace();
                e.preventDefault();
            } else if (e.key === 'Enter') {
                submitPin();
                e.preventDefault();
            }
        });

        // ============================================================
        // SWITCH METHOD
        // ============================================================
        function switchMethod(method) {
            if (state.isSubmitting) return;

            state.currentMethod = method;

            if (method === 'pin') {
                DOM.pinPane.classList.remove('hidden');
                DOM.emailPane.classList.add('hidden');
                DOM.pinTab.classList.add('active');
                DOM.emailTab.classList.remove('active');
                DOM.authSub.textContent = 'Enter your email and PIN to sign in';
                hideAlert();
                state.pinValue = '';
                DOM.pinInput.value = '';
                renderDots();
                setTimeout(() => DOM.pinEmail?.focus(), 100);
            } else {
                DOM.emailPane.classList.remove('hidden');
                DOM.pinPane.classList.add('hidden');
                DOM.emailTab.classList.add('active');
                DOM.pinTab.classList.remove('active');
                DOM.authSub.textContent = 'Enter your credentials to continue';
                hideAlert();
                setTimeout(() => DOM.emailInput.focus(), 100);
            }
        }

        // ============================================================
        // ALERT SYSTEM
        // ============================================================
        function showAlert(message, type = 'error') {
            DOM.alertEl.textContent = message;
            DOM.alertEl.className = 'alert ' + type;
            DOM.alertEl.setAttribute('role', 'alert');
        }

        function hideAlert() {
            DOM.alertEl.className = 'alert';
            DOM.alertEl.textContent = '';
            DOM.alertEl.removeAttribute('role');
        }

        // ============================================================
        // SUPABASE CLIENT
        // ============================================================
        function initSupabase() {
            try {
                if (typeof supabase === 'undefined') {
                    throw new Error('Supabase library not loaded');
                }
                state.supabaseClient = supabase.createClient(
                    CONFIG.SUPABASE_URL,
                    CONFIG.SUPABASE_ANON_KEY, {
                        auth: {
                            persistSession: true,
                            autoRefreshToken: true,
                            detectSessionInUrl: false,
                            storageKey: CONFIG.SESSION_KEY
                        }
                    }
                );
                secureLog('Supabase client initialized');
            } catch (error) {
                secureLog('Supabase init error:', error);
                showAlert('System error. Please refresh and try again.', 'error');
            }
        }

        // ============================================================
        // SECURE PIN LOGIN - Uses Edge Function
        // ============================================================
        async function securePinLogin(email, pin) {
            try {
                const { data, error } = await state.supabaseClient.functions
                    .invoke('pin-auth', {
                        body: {
                            action: 'verify',
                            email: email,
                            pin: pin
                        }
                    });

                if (error) throw error;
                if (!data.success) throw new Error(data.error);

                return data.user;

            } catch (error) {
                console.error('PIN verification error:', error);
                throw error;
            }
        }

        // ============================================================
        // LOGIN HANDLER - FIXED (PIN only)
        // ============================================================
        async function handleLogin(e) {
            e.preventDefault();

            if (state.isSubmitting) return;

            hideAlert();

            state.isSubmitting = true;
            DOM.loginBtn.disabled = true;
            DOM.btnText.style.display = 'none';
            DOM.btnSpinner.style.display = 'inline-block';

            try {
                let email = '';

                if (state.currentMethod === 'pin') {
                    // Get email from PIN email field
                    email = DOM.pinEmail?.value?.trim();

                    if (!email) {
                        throw new Error('Please enter your email address.');
                    }

                    if (!email.includes('@') || !email.includes('.')) {
                        throw new Error('Please enter a valid email address.');
                    }

                    // Validate PIN
                    if (state.pinValue.length < CONFIG.PIN_MIN || state.pinValue.length > CONFIG.PIN_MAX) {
                        throw new Error('PIN must be ' + CONFIG.PIN_MIN + '-' + CONFIG.PIN_MAX + ' digits.');
                    }

                    // ✅ SECURE: Verify PIN via Edge Function
                    const user = await securePinLogin(email, state.pinValue);

                    if (!user || user.status !== 'active') {
                        throw new Error('Invalid credentials or inactive account.');
                    }

                    // Get user with role from database
                    const { data: userData, error: userError } = await state.supabaseClient
                        .from('users')
                        .select(`
                            id,
                            email,
                            full_name,
                            role_id,
                            status,
                            phone,
                            roles:role_id (
                                id,
                                name,
                                description,
                                permissions
                            )
                        `)
                        .eq('email', email)
                        .single();

                    if (userError || !userData) {
                        throw new Error('User profile not found. Please contact support.');
                    }

                    if (userData.status !== 'active') {
                        throw new Error('Account is inactive. Contact support.');
                    }

                    const roleId = userData.role_id;
                    const roleName = userData.roles?.name || 'cashier';
                    const permissions = userData.roles?.permissions || {};
                    const redirectPath = CONFIG.REDIRECT_MAP[roleId] || CONFIG.DEFAULT_REDIRECT;

                    // Store session (no Supabase Auth needed)
                    const sessionData = {
                        user: {
                            ...userData,
                            role_name: roleName,
                            permissions: permissions
                        },
                        loginMethod: 'pin',
                        loginTime: Date.now(),
                        rememberMe: DOM.remember ? DOM.remember.checked : false
                    };

                    localStorage.setItem(CONFIG.SESSION_KEY, JSON.stringify(sessionData));
                    secureLog('PIN session stored for: ' + email);

                    // Redirect
                    window.location.replace(redirectPath);
                    return;

                } else {
                    // ============================================================
                    // EMAIL LOGIN
                    // ============================================================
                    email = DOM.emailInput.value.trim();
                    const password = DOM.passwordInput.value;

                    if (!email || !password) {
                        throw new Error('Please enter both email and password.');
                    }

                    if (!email.includes('@') || !email.includes('.')) {
                        throw new Error('Please enter a valid email address.');
                    }

                    // Authenticate with Supabase
                    const { data: authData, error: authError } = await state.supabaseClient.auth
                        .signInWithPassword({
                            email: email,
                            password: password
                        });

                    if (authError) {
                        throw new Error(authError.message || 'Authentication failed.');
                    }

                    // Get user with role
                    const { data: userData, error: userError } = await state.supabaseClient
                        .from('users')
                        .select(`
                            id,
                            email,
                            full_name,
                            role_id,
                            status,
                            phone,
                            roles:role_id (
                                id,
                                name,
                                description,
                                permissions
                            )
                        `)
                        .eq('email', email)
                        .single();

                    if (userError || !userData) {
                        throw new Error('User profile not found. Please contact support.');
                    }

                    if (userData.status !== 'active') {
                        throw new Error('Account is inactive. Contact support.');
                    }

                    const roleId = userData.role_id;
                    const roleName = userData.roles?.name || 'cashier';
                    const permissions = userData.roles?.permissions || {};
                    const redirectPath = CONFIG.REDIRECT_MAP[roleId] || CONFIG.DEFAULT_REDIRECT;

                    // Store session
                    const sessionData = {
                        user: {
                            ...userData,
                            role_name: roleName,
                            permissions: permissions
                        },
                        session: authData.session,
                        loginMethod: 'email',
                        loginTime: Date.now(),
                        rememberMe: DOM.remember ? DOM.remember.checked : false
                    };

                    localStorage.setItem(CONFIG.SESSION_KEY, JSON.stringify(sessionData));
                    secureLog('Email session stored for: ' + email);

                    // Redirect
                    window.location.replace(redirectPath);
                }

            } catch (error) {
                const message = getErrorMessage(error);
                showAlert(message, 'error');
                secureLog('Login error:', error.message);

                DOM.loginBtn.disabled = false;
                DOM.btnText.style.display = 'inline';
                DOM.btnSpinner.style.display = 'none';
                state.isSubmitting = false;
            }
        }

        // ============================================================
        // SESSION CHECK
        // ============================================================
        function checkExistingSession() {
            try {
                const stored = localStorage.getItem(CONFIG.SESSION_KEY);
                if (!stored) return;

                const session = JSON.parse(stored);
                if (!session || !session.user) return;

                const roleId = session.user.role_id;
                const redirectPath = CONFIG.REDIRECT_MAP[roleId] || CONFIG.DEFAULT_REDIRECT;

                if (window.location.pathname.includes('login') ||
                    window.location.pathname.includes('index') ||
                    window.location.pathname === '/') {
                    window.location.replace(redirectPath);
                }
            } catch (e) {
                localStorage.removeItem(CONFIG.SESSION_KEY);
                secureLog('Session check failed:', e);
            }
        }

        // ============================================================
        // INITIALIZATION
        // ============================================================
        function init() {
            try {
                cacheDom();
                initSupabase();
                checkExistingSession();

                DOM.loginForm.addEventListener('submit', handleLogin);

                // Set default to PIN mode
                switchMethod('pin');

                const urlParams = new URLSearchParams(window.location.search);
                const errorMsg = urlParams.get('error');
                if (errorMsg) {
                    showAlert(decodeURIComponent(errorMsg), 'error');
                }

                secureLog('Viewpoint POS login page initialized');

            } catch (error) {
                secureLog('Initialization error:', error);
                if (DOM.alertEl) {
                    showAlert('Some features may be limited. Please refresh.', 'error');
                }
            }
        }

        // ============================================================
        // EXPOSE GLOBALS
        // ============================================================
        window.pinPress = pinPress;
        window.pinBackspace = pinBackspace;
        window.submitPin = submitPin;
        window.switchMethod = switchMethod;

        // ============================================================
        // BOOT
        // ============================================================
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }

    })();
</script>
</body>
</html>
