<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viewpoint POS - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ============================================================
           ULTRA MODERN LOGIN PAGE - COMPLETE STYLES
           ============================================================ */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0F172A;
            overflow: hidden;
            position: relative;
        }

        /* ----- ANIMATED BACKGROUND PARTICLES ----- */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(108, 60, 225, 0.15);
            animation: floatUp linear infinite;
        }

        .particle:nth-child(1) { width: 80px; height: 80px; left: 10%; animation-duration: 20s; animation-delay: 0s; }
        .particle:nth-child(2) { width: 120px; height: 120px; left: 30%; animation-duration: 25s; animation-delay: 2s; }
        .particle:nth-child(3) { width: 60px; height: 60px; left: 50%; animation-duration: 18s; animation-delay: 4s; }
        .particle:nth-child(4) { width: 100px; height: 100px; left: 70%; animation-duration: 22s; animation-delay: 1s; }
        .particle:nth-child(5) { width: 40px; height: 40px; left: 85%; animation-duration: 15s; animation-delay: 3s; }
        .particle:nth-child(6) { width: 150px; height: 150px; left: 20%; animation-duration: 30s; animation-delay: 5s; }
        .particle:nth-child(7) { width: 70px; height: 70px; left: 60%; animation-duration: 20s; animation-delay: 2.5s; }
        .particle:nth-child(8) { width: 90px; height: 90px; left: 40%; animation-duration: 28s; animation-delay: 3.5s; }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) scale(1);
                opacity: 0;
            }
        }

        /* ----- GRADIENT ORB BACKGROUND ----- */
        .gradient-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
        }

        .gradient-orb.orb1 {
            width: 400px;
            height: 400px;
            top: -100px;
            right: -100px;
            background: rgba(108, 60, 225, 0.3);
            animation: pulseOrb 8s ease-in-out infinite alternate;
        }

        .gradient-orb.orb2 {
            width: 300px;
            height: 300px;
            bottom: -50px;
            left: -50px;
            background: rgba(139, 92, 246, 0.2);
            animation: pulseOrb 10s ease-in-out infinite alternate-reverse;
        }

        .gradient-orb.orb3 {
            width: 200px;
            height: 200px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(59, 130, 246, 0.1);
            animation: pulseOrb 12s ease-in-out infinite alternate;
        }

        @keyframes pulseOrb {
            0% { transform: scale(1) translate(0, 0); opacity: 0.5; }
            100% { transform: scale(1.5) translate(20px, -20px); opacity: 1; }
        }

        /* ----- LOGIN CONTAINER ----- */
        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            padding: 20px;
        }

        /* ----- LOGIN BOX ----- */
        .login-box {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 32px;
            padding: 48px 40px;
            box-shadow: 
                0 30px 80px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .login-box::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 20%, rgba(108, 60, 225, 0.05) 0%, transparent 60%);
            pointer-events: none;
            animation: rotateGlow 20s linear infinite;
        }

        @keyframes rotateGlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ----- LOGIN HEADER ----- */
        .login-header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
        }

        .login-header .icon-wrapper {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, rgba(108, 60, 225, 0.2), rgba(139, 92, 246, 0.1));
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            margin-bottom: 16px;
            position: relative;
            transition: all 0.4s ease;
            animation: floatIcon 4s ease-in-out infinite;
        }

        @keyframes floatIcon {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        .login-header .icon-wrapper i {
            font-size: 36px;
            background: linear-gradient(135deg, #8B5CF6, #6C3CE1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .login-header .icon-wrapper .glow-ring {
            position: absolute;
            inset: -4px;
            border-radius: 28px;
            background: linear-gradient(135deg, rgba(108, 60, 225, 0.3), rgba(139, 92, 246, 0.1));
            filter: blur(10px);
            z-index: -1;
            animation: pulseGlow 3s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }

        .login-header h1 {
            font-size: 28px;
            font-weight: 800;
            color: #fff;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .login-header h1 span {
            background: linear-gradient(135deg, #8B5CF6, #6C3CE1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .login-header p {
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            font-weight: 400;
        }

        /* ----- FORM ----- */
        .form-group {
            margin-bottom: 18px;
            position: relative;
        }

        .form-group label {
            display: block;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 500;
            font-size: 13px;
            margin-bottom: 6px;
            letter-spacing: 0.3px;
        }

        .form-group .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            transition: all 0.3s ease;
        }

        .form-group .input-wrapper:focus-within {
            border-color: rgba(108, 60, 225, 0.5);
            box-shadow: 0 0 0 4px rgba(108, 60, 225, 0.08);
            background: rgba(255, 255, 255, 0.05);
        }

        .form-group .input-wrapper .input-icon {
            padding: 0 0 0 16px;
            color: rgba(255, 255, 255, 0.2);
            font-size: 16px;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .form-group .input-wrapper:focus-within .input-icon {
            color: rgba(108, 60, 225, 0.6);
        }

        .form-group .input-wrapper input {
            width: 100%;
            padding: 14px 16px;
            border: none;
            background: transparent;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            color: #fff;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-group .input-wrapper input::placeholder {
            color: rgba(255, 255, 255, 0.2);
            font-weight: 400;
        }

        .form-group .input-wrapper .toggle-password {
            padding: 0 16px 0 0;
            color: rgba(255, 255, 255, 0.15);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 15px;
            flex-shrink: 0;
        }

        .form-group .input-wrapper .toggle-password:hover {
            color: rgba(255, 255, 255, 0.4);
        }

        /* ----- LOGIN BUTTON ----- */
        .btn-login {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #6C3CE1, #8B5CF6);
            color: #fff;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            margin-top: 8px;
            box-shadow: 0 4px 24px rgba(108, 60, 225, 0.3);
        }

        .btn-login::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.6s ease;
        }

        .btn-login:hover::before {
            left: 100%;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 40px rgba(108, 60, 225, 0.4);
        }

        .btn-login:active {
            transform: translateY(0px);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-login .btn-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-login .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ----- ERROR MESSAGE ----- */
        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.15);
            color: #EF4444;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            display: none;
            font-size: 14px;
            font-weight: 500;
            animation: shake 0.5s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        /* ----- DEMO CREDENTIALS ----- */
        .demo-section {
            margin-top: 28px;
            padding-top: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
        }

        .demo-section .demo-label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .demo-section .demo-label i {
            font-size: 14px;
        }

        .demo-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        @media (max-width: 480px) {
            .demo-grid {
                grid-template-columns: 1fr;
            }
        }

        .demo-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
        }

        .demo-item:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(108, 60, 225, 0.2);
            transform: translateX(4px);
            color: rgba(255, 255, 255, 0.8);
        }

        .demo-item .role-badge {
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            flex-shrink: 0;
        }

        .role-badge.admin { background: rgba(108, 60, 225, 0.3); color: #8B5CF6; }
        .role-badge.cashier { background: rgba(16, 185, 129, 0.3); color: #10B981; }
        .role-badge.butcher { background: rgba(245, 158, 11, 0.3); color: #F59E0B; }
        .role-badge.kitchen { background: rgba(59, 130, 246, 0.3); color: #3B82F6; }

        .demo-item .demo-email {
            font-weight: 500;
            color: rgba(255, 255, 255, 0.6);
        }

        /* ----- FOOTER ----- */
        .login-footer {
            text-align: center;
            margin-top: 24px;
            color: rgba(255, 255, 255, 0.15);
            font-size: 12px;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        .login-footer span {
            color: rgba(108, 60, 225, 0.3);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .login-box {
                padding: 32px 24px;
                border-radius: 24px;
            }

            .login-header h1 {
                font-size: 24px;
            }

            .login-header .icon-wrapper {
                width: 64px;
                height: 64px;
            }

            .login-header .icon-wrapper i {
                font-size: 28px;
            }

            .form-group .input-wrapper input {
                font-size: 14px;
                padding: 12px 14px;
            }

            .btn-login {
                padding: 14px;
                font-size: 15px;
            }
        }

        @media (max-width: 380px) {
            .login-box {
                padding: 24px 16px;
            }

            .demo-item {
                font-size: 11px;
                padding: 8px 10px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== ANIMATED BACKGROUND ===== -->
    <div class="gradient-orb orb1"></div>
    <div class="gradient-orb orb2"></div>
    <div class="gradient-orb orb3"></div>

    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <!-- ===== LOGIN CONTAINER ===== -->
    <div class="login-container">

        <div class="login-box">

            <!-- Header -->
            <div class="login-header">
                <div class="icon-wrapper">
                    <div class="glow-ring"></div>
                    <i class="fas fa-store"></i>
                </div>
                <h1>Welcome to <span>Viewpoint</span></h1>
                <p>Butchery & Restaurant POS System</p>
            </div>

            <!-- Login Form -->
            <form id="loginForm">
                <div id="loginError" class="error-message"></div>

                <div class="form-group">
                    <label><i class="fas fa-envelope" style="margin-right:6px;"></i> Email Address</label>
                    <div class="input-wrapper">
                        <span class="input-icon"><i class="fas fa-envelope"></i></span>
                        <input type="email" id="email" placeholder="Enter your email" required autocomplete="email">
                    </div>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-lock" style="margin-right:6px;"></i> Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon"><i class="fas fa-lock"></i></span>
                        <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
                        <span class="toggle-password" onclick="togglePassword()">
                            <i class="fas fa-eye" id="toggleIcon"></i>
                        </span>
                    </div>
                </div>

                <button type="submit" class="btn-login" id="loginBtn">
                    <span class="btn-content">
                        <i class="fas fa-sign-in-alt"></i>
                        <span id="btnText">Login</span>
                    </span>
                </button>
            </form>

            <!-- Demo Credentials -->
            <div class="demo-section">
                <div class="demo-label">
                    <i class="fas fa-rocket"></i>
                    Quick Demo Access
                </div>
                <div class="demo-grid">
                    <div class="demo-item" onclick="fillLogin('admin@viewpoint.com','admin123')">
                        <span class="role-badge admin">Admin</span>
                        <span class="demo-email">admin@viewpoint.com</span>
                    </div>
                    <div class="demo-item" onclick="fillLogin('cashier@viewpoint.com','cashier123')">
                        <span class="role-badge cashier">Cashier</span>
                        <span class="demo-email">cashier@viewpoint.com</span>
                    </div>
                    <div class="demo-item" onclick="fillLogin('butcher@viewpoint.com','butcher123')">
                        <span class="role-badge butcher">Butcher</span>
                        <span class="demo-email">butcher@viewpoint.com</span>
                    </div>
                    <div class="demo-item" onclick="fillLogin('kitchen@viewpoint.com','kitchen123')">
                        <span class="role-badge kitchen">Kitchen</span>
                        <span class="demo-email">kitchen@viewpoint.com</span>
                    </div>
                </div>
            </div>

            <!-- Footer -->
            <div class="login-footer">
                <span>✦</span> Secure Login • Powered by Supabase <span>✦</span>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ============================================================
        //  SUPABASE CONFIG
        // ============================================================
        const SUPABASE_CONFIG = {
            url: 'https://sipgnykshaxrxwdeswfc.supabase.co',
            anonKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNpcGdueWtzaGF4cnh3ZGVzd2ZjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4OTA2MzMsImV4cCI6MjEwMjQ2NjYzM30.xJtq_3jNMLnXCyVSurdIuUnrlmZEyMWNO1-Azk_4k2E'
        };
        const supabaseClient = supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey);

        // ============================================================
        //  TOGGLE PASSWORD VISIBILITY
        // ============================================================
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const icon = document.getElementById('toggleIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                passwordInput.type = 'password';
                icon.className = 'fas fa-eye';
            }
        }

        // ============================================================
        //  FILL LOGIN
        // ============================================================
        function fillLogin(email, password) {
            document.getElementById('email').value = email;
            document.getElementById('password').value = password;
            // Add visual feedback
            const btn = document.getElementById('loginBtn');
            btn.style.transform = 'scale(0.98)';
            setTimeout(() => {
                btn.style.transform = '';
                document.getElementById('loginForm').dispatchEvent(new Event('submit'));
            }, 200);
        }

        // ============================================================
        //  LOGIN HANDLER
        // ============================================================
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('loginError');
            const loginBtn = document.getElementById('loginBtn');
            const btnText = document.getElementById('btnText');

            errorDiv.style.display = 'none';
            errorDiv.textContent = '';
            loginBtn.disabled = true;
            btnText.textContent = 'Logging in...';
            loginBtn.querySelector('.btn-content').innerHTML = `
                    <span class="spinner"></span>
                    <span>Logging in...</span>
                `;

            try {
                // 1. Authenticate
                const { data: authData, error: authError } = await supabaseClient.auth
                    .signInWithPassword({ email, password });

                if (authError) throw new Error(authError.message);

                // 2. Get user from database
                const { data: userData, error: userError } = await supabaseClient
                    .from('users')
                    .select('*')
                    .eq('email', email)
                    .single();

                if (userError || !userData) {
                    throw new Error('User profile not found. Please contact admin.');
                }

                // 3. Get role
                const { data: roleData, error: roleError } = await supabaseClient
                    .from('roles')
                    .select('*')
                    .eq('id', userData.role_id)
                    .single();

                let roleName = 'cashier';
                if (!roleError && roleData) {
                    roleName = roleData.name;
                }

                // 4. Store session
                const userWithRole = {
                    ...userData,
                    roles: roleData || { name: 'cashier', permissions: {} }
                };

                localStorage.setItem('viewpoint_session', JSON.stringify({
                    user: userWithRole,
                    session: authData.session
                }));

                // 5. Redirect
                const redirectMap = {
                    'admin': 'admin-dashboard.html',
                    'cashier': 'cashier-pos.html',
                    'butcher': 'sales-dashboard.html',
                    'kitchen': 'sales-dashboard.html'
                };

                const redirectUrl = redirectMap[roleName] || 'admin-dashboard.html';
                window.location.href = redirectUrl;

            } catch (error) {
                errorDiv.textContent = error.message || 'Login failed. Please try again.';
                errorDiv.style.display = 'block';
                loginBtn.disabled = false;
                loginBtn.querySelector('.btn-content').innerHTML = `
                        <i class="fas fa-sign-in-alt"></i>
                        <span>Login</span>
                    `;
            }
        });

        // ============================================================
        //  SESSION CHECK
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            const stored = localStorage.getItem('viewpoint_session');
            if (stored) {
                try {
                    const { user } = JSON.parse(stored);
                    if (user) {
                        const role = user.roles?.name || 'admin';
                        const redirectMap = {
                            'admin': 'admin-dashboard.html',
                            'cashier': 'cashier-pos.html',
                            'butcher': 'sales-dashboard.html',
                            'kitchen': 'sales-dashboard.html'
                        };
                        window.location.href = redirectMap[role] || 'admin-dashboard.html';
                    }
                } catch (e) {}
            }
        });

        // ============================================================
        //  KEYBOARD SHORTCUTS
        // ============================================================
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && document.activeElement === document.getElementById('password')) {
                document.getElementById('loginForm').dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
