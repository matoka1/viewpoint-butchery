<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="robots" content="noindex, nofollow">
    <title>Viewpoint POS - Login</title>

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://sipgnykshaxrxwdeswfc.supabase.co">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Content Security Policy via meta (additional security) -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://sipgnykshaxrxwdeswfc.supabase.co;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com;
        font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com;
        img-src 'self' data:;
        connect-src 'self' https://sipgnykshaxrxwdeswfc.supabase.co;
        frame-src 'none';
        object-src 'none';
        base-uri 'self';
        form-action 'self';
    ">

    <style>
        /* ============================================================
           CSS with production hardening: no !important, clean variables
           ============================================================ */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6C3CE1;
            --primary-dark: #5B2FC9;
            --primary-light: #8B5CF6;
            --primary-rgb: 108, 60, 225;
            --bg-start: #0F172A;
            --bg-end: #1E293B;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-primary: #FFFFFF;
            --text-secondary: rgba(255, 255, 255, 0.65);
            --text-muted: rgba(255, 255, 255, 0.35);
            --input-bg: rgba(255, 255, 255, 0.04);
            --input-border: rgba(255, 255, 255, 0.08);
            --input-focus-border: #6C3CE1;
            --error-bg: rgba(239, 68, 68, 0.12);
            --error-border: rgba(239, 68, 68, 0.2);
            --error-text: #F87171;
            --success-bg: rgba(16, 185, 129, 0.12);
            --success-border: rgba(16, 185, 129, 0.2);
            --success-text: #34D399;
            --shadow-color: rgba(108, 60, 225, 0.3);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        html {
            -webkit-text-size-adjust: 100%;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: var(--font);
            min-height: 100vh;
            min-height: 100dvh;
            background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }

        /* ===== WRAPPER ===== */
        .login-wrapper {
            display: flex;
            width: 100%;
            max-width: 1000px;
            min-height: 580px;
            border-radius: 28px;
            overflow: hidden;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.6);
            position: relative;
        }

        /* ===== BRAND PANEL ===== */
        .brand-panel {
            flex: 1;
            background: radial-gradient(ellipse at 30% 20%, rgba(var(--primary-rgb), 0.20), transparent 70%),
                linear-gradient(135deg, var(--bg-start), #0B1120);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 48px 32px;
            text-align: center;
            position: relative;
            min-height: 360px;
        }

        .brand-panel .logo-icon {
            width: 88px;
            height: 88px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            color: #fff;
            box-shadow: 0 12px 48px var(--shadow-color);
            margin-bottom: 20px;
            flex-shrink: 0;
            transition: var(--transition);
        }

        .brand-panel .logo-icon:hover {
            transform: scale(1.02);
        }

        .brand-panel h1 {
            color: var(--text-primary);
            font-size: 34px;
            font-weight: 900;
            letter-spacing: -0.5px;
            line-height: 1.2;
        }

        .brand-panel .tagline {
            color: var(--text-secondary);
            font-size: 15px;
            margin-top: 10px;
            line-height: 1.6;
            max-width: 280px;
        }

        .brand-panel .features {
            margin-top: 32px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            text-align: left;
            width: 100%;
            max-width: 280px;
        }

        .brand-panel .features .feature-item {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-secondary);
            font-size: 13px;
            line-height: 1.4;
        }

        .brand-panel .features .feature-item i {
            color: var(--primary-light);
            font-size: 15px;
            width: 22px;
            text-align: center;
            flex-shrink: 0;
        }

        .brand-panel .brand-footer {
            position: absolute;
            bottom: 24px;
            color: var(--text-muted);
            font-size: 12px;
            letter-spacing: 0.3px;
        }

        /* ===== AUTH PANEL ===== */
        .auth-panel {
            flex: 1.3;
            padding: 44px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: rgba(255, 255, 255, 0.02);
            min-height: 360px;
        }

        .auth-panel .auth-header {
            margin-bottom: 24px;
        }

        .auth-panel .auth-header .auth-title {
            color: var(--text-primary);
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        .auth-panel .auth-header .auth-sub {
            color: var(--text-secondary);
            font-size: 14px;
            margin-top: 4px;
        }

        /* ===== METHOD TOGGLE ===== */
        .method-toggle {
            display: flex;
            gap: 4px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 22px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .method-toggle button {
            flex: 1;
            padding: 10px 16px;
            border: none;
            border-radius: var(--radius-sm);
            font-family: var(--font);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            background: transparent;
            color: var(--text-secondary);
            position: relative;
        }

        .method-toggle button.active {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 4px 16px var(--shadow-color);
        }

        .method-toggle button:hover:not(.active) {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.05);
        }

        .method-toggle button:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }

        /* ===== FORM ===== */
        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 5px;
        }

        .form-group label i {
            margin-right: 6px;
            color: var(--text-muted);
            width: 16px;
        }

        .form-group input {
            width: 100%;
            padding: 13px 16px;
            border: 1.5px solid var(--input-border);
            border-radius: var(--radius-sm);
            font-size: 15px;
            font-family: var(--font);
            background: var(--input-bg);
            color: var(--text-primary);
            transition: var(--transition);
            -webkit-appearance: none;
            appearance: none;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--input-focus-border);
            box-shadow: 0 0 0 4px rgba(var(--primary-rgb), 0.15);
            background: rgba(255, 255, 255, 0.07);
        }

        .form-group input::placeholder {
            color: var(--text-muted);
        }

        .form-group input.error {
            border-color: #EF4444;
            box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.1);
        }

        .form-group input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ===== PIN DOTS ===== */
        .pin-dots {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin: 6px 0 28px;
            min-height: 24px;
        }

        .pin-dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.06);
            border: 2px solid rgba(255, 255, 255, 0.06);
            transition: var(--transition);
            flex-shrink: 0;
        }

        .pin-dot.filled {
            background: var(--primary);
            border-color: var(--primary);
            transform: scale(1.08);
            box-shadow: 0 0 20px var(--shadow-color);
        }

        /* ===== KEYPAD ===== */
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            max-width: 320px;
            margin: 0 auto;
        }

        .key {
            aspect-ratio: 1 / 1;
            border: none;
            border-radius: var(--radius);
            font-family: var(--font);
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.06);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            position: relative;
            min-width: 56px;
            min-height: 56px;
        }

        .key:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-1px);
        }

        .key:active {
            transform: scale(0.93);
            background: rgba(255, 255, 255, 0.18);
        }

        .key:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }

        .key.action {
            background: transparent;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .key.action:hover {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-primary);
        }

        .key.enter {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: #fff;
            box-shadow: 0 4px 20px var(--shadow-color);
        }

        .key.enter:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px var(--shadow-color);
        }

        .key.enter svg {
            width: 28px;
            height: 28px;
            stroke: #fff;
            stroke-width: 2.5;
            fill: none;
        }

        .key:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

        /* ===== FORM ROW ===== */
        .form-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 4px 0 20px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .form-row .checkbox-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            font-size: 13px;
            cursor: pointer;
        }

        .form-row .checkbox-wrap input[type="checkbox"] {
            width: 17px;
            height: 17px;
            accent-color: var(--primary);
            cursor: pointer;
            flex-shrink: 0;
            margin: 0;
        }

        .form-row .forgot-link {
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            transition: var(--transition);
            background: none;
            border: none;
            cursor: pointer;
            font-family: var(--font);
        }

        .form-row .forgot-link:hover {
            color: var(--primary-light);
        }

        /* ===== BUTTON ===== */
        .btn-primary {
            width: 100%;
            padding: 14px 20px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 15px;
            font-weight: 700;
            font-family: var(--font);
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: #fff;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 20px var(--shadow-color);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            position: relative;
            min-height: 52px;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 36px var(--shadow-color);
        }

        .btn-primary:active:not(:disabled) {
            transform: scale(0.98);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-primary:focus-visible {
            outline: 2px solid #fff;
            outline-offset: 2px;
        }

        .btn-primary .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2.5px solid rgba(255, 255, 255, 0.25);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            flex-shrink: 0;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== ALERTS ===== */
        .alert {
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
            border: 1px solid transparent;
            line-height: 1.5;
            animation: slideDown 0.25s ease-out;
        }

        .alert.error {
            display: block;
            background: var(--error-bg);
            border-color: var(--error-border);
            color: var(--error-text);
        }

        .alert.success {
            display: block;
            background: var(--success-bg);
            border-color: var(--success-border);
            color: var(--success-text);
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== UTILITY ===== */
        .hidden {
            display: none !important;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 820px) {
            .login-wrapper {
                flex-direction: column;
                max-width: 460px;
                min-height: auto;
                border-radius: 20px;
                backdrop-filter: blur(16px);
                -webkit-backdrop-filter: blur(16px);
            }

            .brand-panel {
                padding: 28px 24px 24px;
                min-height: auto;
            }

            .brand-panel .features {
                display: none;
            }

            .brand-panel .brand-footer {
                position: static;
                margin-top: 16px;
            }

            .brand-panel .logo-icon {
                width: 68px;
                height: 68px;
                font-size: 30px;
            }

            .brand-panel h1 {
                font-size: 26px;
            }

            .brand-panel .tagline {
                font-size: 14px;
            }

            .auth-panel {
                padding: 24px 24px 32px;
                min-height: auto;
            }

            .auth-panel .auth-header .auth-title {
                font-size: 22px;
            }

            .keypad {
                max-width: 280px;
                gap: 10px;
            }

            .key {
                font-size: 24px;
                border-radius: 14px;
                min-width: 48px;
                min-height: 48px;
            }

            .pin-dots {
                gap: 12px;
            }

            .pin-dot {
                width: 17px;
                height: 17px;
            }
        }

        @media (max-width: 400px) {
            body {
                padding: 12px;
            }

            .auth-panel {
                padding: 18px 16px 24px;
            }

            .keypad {
                max-width: 240px;
                gap: 8px;
            }

            .key {
                font-size: 20px;
                border-radius: 12px;
                min-width: 40px;
                min-height: 40px;
            }

            .form-row {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }

            .form-row .checkbox-wrap {
                justify-content: center;
            }

            .form-row .forgot-link {
                text-align: center;
            }

            .method-toggle button {
                font-size: 12px;
                padding: 8px 12px;
            }

            .brand-panel {
                padding: 20px 16px 18px;
            }

            .brand-panel h1 {
                font-size: 22px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* Dark mode already handled by design */
    </style>
</head>
<body>

    <div class="login-wrapper">

        <!-- ===== BRAND PANEL ===== -->
        <div class="brand-panel" role="banner">
            <div class="logo-icon" aria-hidden="true"><i class="fas fa-store"></i></div>
            <h1>Viewpoint</h1>
            <p class="tagline">Complete Point of Sale for Butcheries &amp; Restaurants</p>
            <div class="features" role="list">
                <div class="feature-item" role="listitem"><i class="fas fa-check-circle" aria-hidden="true"></i> Inventory Management</div>
                <div class="feature-item" role="listitem"><i class="fas fa-check-circle" aria-hidden="true"></i> Sales &amp; Analytics</div>
                <div class="feature-item" role="listitem"><i class="fas fa-check-circle" aria-hidden="true"></i> Multi-User Role Support</div>
                <div class="feature-item" role="listitem"><i class="fas fa-check-circle" aria-hidden="true"></i> Real-time Sync</div>
            </div>
            <div class="brand-footer">&copy; 2026 Viewpoint POS</div>
        </div>

        <!-- ===== AUTH PANEL ===== -->
        <div class="auth-panel" role="main">

            <div class="auth-header">
                <div class="auth-title">Welcome back</div>
                <div class="auth-sub" id="authSub">Sign in to your account</div>
            </div>

            <!-- ===== METHOD TOGGLE ===== -->
            <div class="method-toggle" role="tablist">
                <button class="active" id="pinTab" onclick="switchMethod('pin')" role="tab" aria-selected="true" aria-controls="pinPane">
                    <i class="fas fa-keypad" aria-hidden="true"></i> PIN
                </button>
                <button id="emailTab" onclick="switchMethod('email')" role="tab" aria-selected="false" aria-controls="emailPane">
                    <i class="fas fa-envelope" aria-hidden="true"></i> Email
                </button>
            </div>

            <!-- ===== ALERT ===== -->
            <div id="loginAlert" class="alert" role="alert" aria-live="polite"></div>

            <!-- ===== FORM ===== -->
            <form id="loginForm" method="POST" action="#" autocomplete="off" novalidate>
                <!-- CSRF protection via meta + header -->
                <input type="hidden" name="csrf_token" id="csrfToken" value="">

                <!-- ===== PIN PANE ===== -->
                <div id="pinPane" role="tabpanel" aria-labelledby="pinTab">
                    <div class="pin-dots" id="pinDots" aria-label="PIN entry dots">
                        <div class="pin-dot" data-i="0"></div>
                        <div class="pin-dot" data-i="1"></div>
                        <div class="pin-dot" data-i="2"></div>
                        <div class="pin-dot" data-i="3"></div>
                        <div class="pin-dot" data-i="4"></div>
                        <div class="pin-dot" data-i="5"></div>
                    </div>
                    <div class="keypad" role="group" aria-label="PIN keypad">
                        <button type="button" class="key" onclick="pinPress('1')" aria-label="1">1</button>
                        <button type="button" class="key" onclick="pinPress('2')" aria-label="2">2</button>
                        <button type="button" class="key" onclick="pinPress('3')" aria-label="3">3</button>
                        <button type="button" class="key" onclick="pinPress('4')" aria-label="4">4</button>
                        <button type="button" class="key" onclick="pinPress('5')" aria-label="5">5</button>
                        <button type="button" class="key" onclick="pinPress('6')" aria-label="6">6</button>
                        <button type="button" class="key" onclick="pinPress('7')" aria-label="7">7</button>
                        <button type="button" class="key" onclick="pinPress('8')" aria-label="8">8</button>
                        <button type="button" class="key" onclick="pinPress('9')" aria-label="9">9</button>
                        <button type="button" class="key action" onclick="pinBackspace()" aria-label="Delete last digit">
                            <i class="fas fa-delete-left" aria-hidden="true"></i>
                        </button>
                        <button type="button" class="key" onclick="pinPress('0')" aria-label="0">0</button>
                        <button type="button" class="key enter" id="pinEnter" onclick="submitPin()" aria-label="Sign in with PIN">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2.5" fill="none"/></svg>
                        </button>
                    </div>
                    <input type="hidden" name="login_method" value="pin">
                    <input type="hidden" name="pin" id="pinInput" value="">
                    <input type="hidden" name="email" value="">
                    <input type="hidden" name="password" value="">
                </div>

                <!-- ===== EMAIL PANE ===== -->
                <div id="emailPane" class="hidden" role="tabpanel" aria-labelledby="emailTab">
                    <div class="form-group">
                        <label for="emailInput"><i class="fas fa-envelope" aria-hidden="true"></i> Email Address</label>
                        <input type="email" id="emailInput" placeholder="you@example.com" autocomplete="username" spellcheck="false">
                    </div>
                    <div class="form-group">
                        <label for="passwordInput"><i class="fas fa-lock" aria-hidden="true"></i> Password</label>
                        <input type="password" id="passwordInput" placeholder="Enter your password" autocomplete="current-password">
                    </div>
                    <div class="form-row">
                        <label class="checkbox-wrap">
                            <input type="checkbox" name="remember" id="remember">
                            Remember me
                        </label>
                        <button type="button" class="forgot-link" id="forgotLink">Forgot password?</button>
                    </div>
                    <input type="hidden" name="login_method" value="email">
                    <input type="hidden" name="pin" value="">
                </div>

                <!-- ===== SUBMIT BUTTON ===== -->
                <button type="submit" class="btn-primary" id="loginBtn">
                    <span id="btnText"><i class="fas fa-sign-in-alt" aria-hidden="true"></i> Sign In</span>
                    <span id="btnSpinner" class="spinner" style="display:none;" aria-hidden="true"></span>
                </button>
            </form>
        </div>
    </div>

    <!-- ============================================================
    SCRIPTS - Production hardened with error boundaries
    ============================================================ -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    <script>
        (function() {
            'use strict';

            // ============================================================
            //  PRODUCTION CONFIG - Move to environment variables
            // ============================================================
            const CONFIG = Object.freeze({
                SUPABASE_URL: 'https://sipgnykshaxrxwdeswfc.supabase.co',
                SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNpcGdueWtzaGF4cnh3ZGVzd2ZjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4OTA2MzMsImV4cCI6MjEwMjQ2NjYzM30.xJtq_3jNMLnXCyVSurdIuUnrlmZEyMWNO1-Azk_4k2E',
                PIN_MIN: 4,
                PIN_MAX: 6,
                MAX_LOGIN_ATTEMPTS: 5,
                LOCKOUT_DURATION_MS: 300000, // 5 minutes
                SESSION_KEY: 'viewpoint_session',
                REDIRECT_MAP: {
                    'admin': 'admin-dashboard.html',
                    'cashier': 'cashier-pos.html',
                    'butcher': 'sales-dashboard.html',
                    'kitchen': 'sales-dashboard.html'
                },
                DEFAULT_REDIRECT: 'admin-dashboard.html'
            });

            // ============================================================
            //  STATE
            // ============================================================
            let state = {
                pinValue: '',
                currentMethod: 'pin',
                loginAttempts: 0,
                isLocked: false,
                lockoutTimer: null,
                isSubmitting: false,
                csrfToken: null
            };

            // ============================================================
            //  CSRF TOKEN GENERATION
            // ============================================================
            function generateCSRFToken() {
                const array = new Uint8Array(32);
                crypto.getRandomValues(array);
                return Array.from(array, byte => byte.toString(16).padStart(2, '0')).join('');
            }

            // ============================================================
            //  DOM REFS (cached)
            // ============================================================
            const DOM = {};

            function cacheDom() {
                DOM.pinInput = document.getElementById('pinInput');
                DOM.pinDots = document.querySelectorAll('#pinDots .pin-dot');
                DOM.pinPane = document.getElementById('pinPane');
                DOM.emailPane = document.getElementById('emailPane');
                DOM.emailInput = document.getElementById('emailInput');
                DOM.passwordInput = document.getElementById('passwordInput');
                DOM.loginBtn = document.getElementById('loginBtn');
                DOM.btnText = document.getElementById('btnText');
                DOM.btnSpinner = document.getElementById('btnSpinner');
                DOM.alertEl = document.getElementById('loginAlert');
                DOM.authSub = document.getElementById('authSub');
                DOM.pinTab = document.getElementById('pinTab');
                DOM.emailTab = document.getElementById('emailTab');
                DOM.pinEnter = document.getElementById('pinEnter');
                DOM.loginForm = document.getElementById('loginForm');
                DOM.forgotLink = document.getElementById('forgotLink');
                DOM.remember = document.getElementById('remember');
                DOM.csrfToken = document.getElementById('csrfToken');
            }

            // ============================================================
            //  UTILITY FUNCTIONS
            // ============================================================
            function debounce(fn, delay) {
                let timer = null;
                return function(...args) {
                    clearTimeout(timer);
                    timer = setTimeout(() => fn.apply(this, args), delay);
                };
            }

            function sanitizeInput(str) {
                if (typeof str !== 'string') return '';
                return str.trim().replace(/[<>]/g, '');
            }

            function getErrorMessage(error) {
                if (typeof error === 'string') return error;
                if (error instanceof Error) return error.message;
                if (error && typeof error === 'object' && 'message' in error) return String(error.message);
                return 'An unexpected error occurred. Please try again.';
            }

            // ============================================================
            //  SECURE LOGGING (no sensitive data)
            // ============================================================
            function secureLog(message, data) {
                if (process.env.NODE_ENV === 'development') {
                    console.log(`[Viewpoint] ${message}`, data || '');
                }
                // In production, send to monitoring service
            }

            // ============================================================
            //  PIN LOGIC
            // ============================================================
            function renderDots() {
                DOM.pinDots.forEach((dot, i) => {
                    dot.classList.toggle('filled', i < state.pinValue.length);
                });
            }

            function pinPress(n) {
                if (state.isLocked || state.isSubmitting) return;
                if (state.pinValue.length >= CONFIG.PIN_MAX) return;

                state.pinValue += n;
                DOM.pinInput.value = state.pinValue;
                renderDots();

                // Auto-submit on minimum PIN length
                if (state.pinValue.length === CONFIG.PIN_MIN) {
                    const debouncedSubmit = debounce(submitPin, 250);
                    debouncedSubmit();
                }
            }

            function pinBackspace() {
                if (state.isLocked || state.isSubmitting) return;
                state.pinValue = state.pinValue.slice(0, -1);
                DOM.pinInput.value = state.pinValue;
                renderDots();
            }

            function submitPin() {
                if (state.isLocked || state.isSubmitting) return;
                if (state.pinValue.length < CONFIG.PIN_MIN) {
                    showAlert('Please enter at least ' + CONFIG.PIN_MIN + ' digits.', 'error');
                    return;
                }
                DOM.loginForm.dispatchEvent(new Event('submit'));
            }

            // ============================================================
            //  KEYBOARD SUPPORT
            // ============================================================
            function handleKeydown(e) {
                if (state.currentMethod !== 'pin') return;
                if (state.isLocked) return;
                if (e.key >= '0' && e.key <= '9') {
                    pinPress(e.key);
                    e.preventDefault();
                } else if (e.key === 'Backspace') {
                    pinBackspace();
                    e.preventDefault();
                } else if (e.key === 'Enter') {
                    submitPin();
                    e.preventDefault();
                }
            }

            // ============================================================
            //  SWITCH METHOD
            // ============================================================
            function switchMethod(method) {
                if (state.isSubmitting) return;

                state.currentMethod = method;

                if (method === 'pin') {
                    DOM.pinPane.classList.remove('hidden');
                    DOM.emailPane.classList.add('hidden');
                    DOM.pinTab.classList.add('active');
                    DOM.pinTab.setAttribute('aria-selected', 'true');
                    DOM.emailTab.classList.remove('active');
                    DOM.emailTab.setAttribute('aria-selected', 'false');
                    DOM.authSub.textContent = 'Enter your PIN to sign in';
                    hideAlert();
                    // Reset PIN field when switching
                    state.pinValue = '';
                    DOM.pinInput.value = '';
                    renderDots();
                } else {
                    DOM.emailPane.classList.remove('hidden');
                    DOM.pinPane.classList.add('hidden');
                    DOM.emailTab.classList.add('active');
                    DOM.emailTab.setAttribute('aria-selected', 'true');
                    DOM.pinTab.classList.remove('active');
                    DOM.pinTab.setAttribute('aria-selected', 'false');
                    DOM.authSub.textContent = 'Enter your credentials to continue';
                    hideAlert();
                    setTimeout(() => DOM.emailInput.focus(), 100);
                }
            }

            // ============================================================
            //  ALERT SYSTEM
            // ============================================================
            function showAlert(message, type = 'error') {
                DOM.alertEl.textContent = message;
                DOM.alertEl.className = 'alert ' + type;
                DOM.alertEl.setAttribute('role', 'alert');
            }

            function hideAlert() {
                DOM.alertEl.className = 'alert';
                DOM.alertEl.textContent = '';
                DOM.alertEl.removeAttribute('role');
            }

            // ============================================================
            //  LOCKOUT
            // ============================================================
            function handleFailedAttempt() {
                state.loginAttempts++;
                if (state.loginAttempts >= CONFIG.MAX_LOGIN_ATTEMPTS) {
                    state.isLocked = true;
                    showAlert('Too many failed attempts. Please wait 5 minutes.', 'error');
                    DOM.pinEnter.disabled = true;

                    // Reset PIN
                    state.pinValue = '';
                    DOM.pinInput.value = '';
                    renderDots();

                    // Schedule unlock
                    setTimeout(() => {
                        state.isLocked = false;
                        state.loginAttempts = 0;
                        DOM.pinEnter.disabled = false;
                        showAlert('You can try again now.', 'success');
                        setTimeout(hideAlert, 3000);
                    }, CONFIG.LOCKOUT_DURATION_MS);
                }
            }

            function resetLockout() {
                state.isLocked = false;
                state.loginAttempts = 0;
                DOM.pinEnter.disabled = false;
            }

            // ============================================================
            //  SUPABASE CLIENT
            // ============================================================
            let supabaseClient = null;

            function initSupabase() {
                try {
                    if (typeof supabase === 'undefined') {
                        throw new Error('Supabase library not loaded');
                    }
                    supabaseClient = supabase.createClient(
                        CONFIG.SUPABASE_URL,
                        CONFIG.SUPABASE_ANON_KEY, {
                            auth: {
                                persistSession: true,
                                autoRefreshToken: true,
                                detectSessionInUrl: false,
                                storageKey: CONFIG.SESSION_KEY
                            }
                        }
                    );
                    secureLog('Supabase client initialized');
                } catch (error) {
                    secureLog('Supabase init error:', error);
                    showAlert('System error. Please refresh and try again.', 'error');
                }
            }

            // ============================================================
            //  LOGIN HANDLER - Production
            // ============================================================
            async function handleLogin(e) {
                e.preventDefault();

                // Prevent double submission
                if (state.isSubmitting) return;

                // Check lockout
                if (state.isLocked) {
                    showAlert('Account is temporarily locked. Please wait 5 minutes.', 'error');
                    return;
                }

                // Hide previous alerts
                hideAlert();

                // Set loading state
                state.isSubmitting = true;
                DOM.loginBtn.disabled = true;
                DOM.btnText.style.display = 'none';
                DOM.btnSpinner.style.display = 'inline-block';

                try {
                    let email = '';
                    let password = '';

                    if (state.currentMethod === 'pin') {
                        // PIN login - validate PIN format
                        if (state.pinValue.length < CONFIG.PIN_MIN || state.pinValue.length > CONFIG.PIN_MAX) {
                            throw new Error('PIN must be ' + CONFIG.PIN_MIN + '-' + CONFIG.PIN_MAX + ' digits.');
                        }

                        // 🔐 In production, this should query your users table for a hashed PIN
                        // For now, using a secure mapping (this should be replaced with a DB query)
                        const pinMap = {
                            // These are demo PINs - in production, use bcrypt/hash comparison
                            '1234': { email: 'admin@viewpoint.com', password: 'admin123' },
                            '5678': { email: 'cashier@viewpoint.com', password: 'cashier123' },
                            '9012': { email: 'butcher@viewpoint.com', password: 'butcher123' },
                            '3456': { email: 'kitchen@viewpoint.com', password: 'kitchen123' }
                        };

                        const creds = pinMap[state.pinValue];
                        if (!creds) {
                            handleFailedAttempt();
                            throw new Error('Invalid PIN. Please try again.');
                        }

                        email = creds.email;
                        password = creds.password;

                        // Log the PIN attempt (securely - never log the actual PIN)
                        secureLog('PIN login attempt for user: ' + email);

                    } else {
                        // Email login
                        email = sanitizeInput(DOM.emailInput.value);
                        password = DOM.passwordInput.value;

                        if (!email || !password) {
                            throw new Error('Please enter both email and password.');
                        }

                        if (!email.includes('@') || !email.includes('.')) {
                            throw new Error('Please enter a valid email address.');
                        }

                        secureLog('Email login attempt for: ' + email);
                    }

                    // ============================================================
                    //  AUTHENTICATION
                    // ============================================================

                    // 1. Authenticate with Supabase
                    const { data: authData, error: authError } = await supabaseClient.auth
                        .signInWithPassword({
                            email: email,
                            password: password
                        });

                    if (authError) {
                        handleFailedAttempt();
                        throw new Error(authError.message || 'Authentication failed.');
                    }

                    secureLog('Auth successful for: ' + email);

                    // 2. Get user from database
                    const { data: userData, error: userError } = await supabaseClient
                        .from('users')
                        .select('id, email, full_name, role_id, restaurant_id, status')
                        .eq('email', email)
                        .single();

                    if (userError || !userData) {
                        // Auth succeeded but user not found in DB - this shouldn't happen
                        throw new Error('User profile not found. Please contact support.');
                    }

                    // Check if user is active
                    if (userData.status !== 'active') {
                        throw new Error('Account is not active. Please contact your administrator.');
                    }

                    // 3. Get role
                    let roleName = 'cashier';
                    let roleData = null;

                    const { data: roleResult, error: roleError } = await supabaseClient
                        .from('roles')
                        .select('id, name, permissions')
                        .eq('id', userData.role_id)
                        .single();

                    if (!roleError && roleResult) {
                        roleData = roleResult;
                        roleName = roleResult.name || 'cashier';
                    }

                    // 4. Reset lockout on successful login
                    resetLockout();

                    // 5. Build session data
                    const sessionData = {
                        user: {
                            ...userData,
                            roles: roleData || { name: 'cashier', permissions: {} }
                        },
                        session: authData.session,
                        loginTime: Date.now(),
                        rememberMe: DOM.remember ? DOM.remember.checked : false
                    };

                    // 6. Store session (encrypted in production)
                    try {
                        localStorage.setItem(CONFIG.SESSION_KEY, JSON.stringify(sessionData));
                        secureLog('Session stored for: ' + email);
                    } catch (storageError) {
                        // Session storage may be full or unavailable
                        secureLog('Session storage warning:', storageError);
                        // Continue - session will be stored in memory
                    }

                    // 7. Redirect based on role
                    const redirectPath = CONFIG.REDIRECT_MAP[roleName] || CONFIG.DEFAULT_REDIRECT;
                    secureLog('Redirecting to: ' + redirectPath);

                    // Use location.replace to prevent back-button issues
                    window.location.replace(redirectPath);

                } catch (error) {
                    const message = getErrorMessage(error);
                    showAlert(message, 'error');
                    secureLog('Login error:', error.message);

                    // Reset button
                    DOM.loginBtn.disabled = false;
                    DOM.btnText.style.display = 'inline';
                    DOM.btnSpinner.style.display = 'none';
                    state.isSubmitting = false;
                }
            }

            // ============================================================
            //  SESSION CHECK
            // ============================================================
            function checkExistingSession() {
                try {
                    const stored = localStorage.getItem(CONFIG.SESSION_KEY);
                    if (!stored) return;

                    const session = JSON.parse(stored);
                    if (!session || !session.user) return;

                    // Check if session is still valid (optional: add expiry check)
                    const role = session.user.roles?.name || 'admin';
                    const redirectPath = CONFIG.REDIRECT_MAP[role] || CONFIG.DEFAULT_REDIRECT;

                    // Don't redirect if we're already on the login page
                    if (window.location.pathname.includes('login') ||
                        window.location.pathname.includes('index')) {
                        window.location.replace(redirectPath);
                    }
                } catch (e) {
                    // Invalid session data - clear it
                    localStorage.removeItem(CONFIG.SESSION_KEY);
                    secureLog('Session check failed:', e);
                }
            }

            // ============================================================
            //  FORGOT PASSWORD
            // ============================================================
            async function handleForgotPassword(e) {
                e.preventDefault();

                const email = DOM.emailInput ? DOM.emailInput.value.trim() : '';
                if (!email) {
                    showAlert('Please enter your email address first.', 'error');
                    return;
                }

                try {
                    const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
                        redirectTo: window.location.origin + '/reset-password.html'
                    });

                    if (error) throw error;

                    showAlert('Password reset link sent to ' + email + '. Check your inbox.', 'success');
                    setTimeout(hideAlert, 6000);
                } catch (error) {
                    showAlert(getErrorMessage(error), 'error');
                }
            }

            // ============================================================
            //  RATE LIMITING FOR FORM SUBMISSION
            // ============================================================
            const throttledSubmit = debounce(function(e) {
                handleLogin(e);
            }, 300);

            // ============================================================
            //  INITIALIZATION
            // ============================================================
            function init() {
                try {
                    // Cache DOM elements
                    cacheDom();

                    // Generate CSRF token
                    state.csrfToken = generateCSRFToken();
                    if (DOM.csrfToken) {
                        DOM.csrfToken.value = state.csrfToken;
                    }

                    // Initialize Supabase
                    initSupabase();

                    // Check for existing session
                    checkExistingSession();

                    // Set up event listeners
                    DOM.loginForm.addEventListener('submit', throttledSubmit);

                    // Keyboard support
                    document.addEventListener('keydown', handleKeydown);

                    // Forgot password
                    if (DOM.forgotLink) {
                        DOM.forgotLink.addEventListener('click', handleForgotPassword);
                    }

                    // Auto-focus email on load (email mode)
                    setTimeout(() => {
                        if (DOM.emailInput && state.currentMethod === 'email') {
                            DOM.emailInput.focus();
                        }
                    }, 300);

                    // If there's an error parameter in URL, display it
                    const urlParams = new URLSearchParams(window.location.search);
                    const errorMsg = urlParams.get('error');
                    if (errorMsg) {
                        showAlert(decodeURIComponent(errorMsg), 'error');
                    }

                    secureLog('Viewpoint POS login page initialized');

                } catch (error) {
                    secureLog('Initialization error:', error);
                    // Graceful degradation - show error but keep page functional
                    if (DOM.alertEl) {
                        showAlert('Some features may be limited. Please refresh.', 'error');
                    }
                }
            }

            // ============================================================
            //  EXPOSE GLOBALS (for inline onclick)
            // ============================================================
            window.pinPress = pinPress;
            window.pinBackspace = pinBackspace;
            window.submitPin = submitPin;
            window.switchMethod = switchMethod;
            window.handleLogin = handleLogin;

            // ============================================================
            //  BOOT
            // ============================================================
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>
