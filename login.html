<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viewpoint POS - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0F172A, #1E293B);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-container {
            width: 100%;
            max-width: 420px;
        }
        .login-box {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 40px 32px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.5);
        }
        .login-logo { text-align: center; margin-bottom: 32px; }
        .login-logo .icon {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, #6C3CE1, #8B5CF6);
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: #fff;
            box-shadow: 0 8px 32px rgba(108,60,225,0.3);
        }
        .login-logo h1 {
            color: #fff;
            font-size: 28px;
            font-weight: 800;
            margin-top: 12px;
        }
        .login-logo p {
            color: rgba(255,255,255,0.5);
            font-size: 14px;
        }
        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block;
            color: rgba(255,255,255,0.7);
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 5px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            background: rgba(255,255,255,0.05);
            color: #fff;
            transition: all 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #6C3CE1;
            box-shadow: 0 0 0 4px rgba(108,60,225,0.15);
        }
        .form-group input::placeholder { color: rgba(255,255,255,0.3); }
        .btn-login {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #6C3CE1, #8B5CF6);
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 16px rgba(108,60,225,0.3);
        }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(108,60,225,0.4); }
        .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .error-message {
            background: rgba(239,68,68,0.15);
            color: #EF4444;
            padding: 10px 14px;
            border-radius: 10px;
            margin-bottom: 16px;
            border: 1px solid rgba(239,68,68,0.2);
            display: none;
            font-size: 14px;
        }
        .demo-credentials {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        .demo-credentials p {
            color: rgba(255,255,255,0.4);
            font-size: 12px;
            margin-bottom: 8px;
        }
        .demo-grid {
            display: grid;
            gap: 6px;
        }
        .demo-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: 8px;
            background: rgba(255,255,255,0.03);
            cursor: pointer;
            transition: all 0.3s;
            font-size: 12px;
            color: rgba(255,255,255,0.6);
        }
        .demo-item:hover { background: rgba(255,255,255,0.08); color: #fff; }
        .demo-item .role-badge {
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
        }
        .role-badge.admin { background: #6C3CE1; color: #fff; }
        .role-badge.cashier { background: #10B981; color: #fff; }
        .role-badge.butcher { background: #F59E0B; color: #1E293B; }
        .role-badge.kitchen { background: #3B82F6; color: #fff; }
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-logo">
                <div class="icon"><i class="fas fa-store"></i></div>
                <h1>Viewpoint</h1>
                <p>Butchery & Restaurant POS</p>
            </div>

            <form id="loginForm">
                <div id="loginError" class="error-message"></div>
                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> Email</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn-login" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
            </form>

            <div class="demo-credentials">
                <p>📋 Demo Credentials (click to auto-fill)</p>
                <div class="demo-grid">
                    <div class="demo-item" onclick="fillLogin('admin@viewpoint.com','admin123')">
                        <span class="role-badge admin">Admin</span> admin@viewpoint.com / admin123
                    </div>
                    <div class="demo-item" onclick="fillLogin('cashier@viewpoint.com','cashier123')">
                        <span class="role-badge cashier">Cashier</span> cashier@viewpoint.com / cashier123
                    </div>
                    <div class="demo-item" onclick="fillLogin('butcher@viewpoint.com','butcher123')">
                        <span class="role-badge butcher">Butcher</span> butcher@viewpoint.com / butcher123
                    </div>
                    <div class="demo-item" onclick="fillLogin('kitchen@viewpoint.com','kitchen123')">
                        <span class="role-badge kitchen">Kitchen</span> kitchen@viewpoint.com / kitchen123
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ===== CONFIG =====
        const SUPABASE_CONFIG = {
            url: 'https://sipgnykshaxrxwdeswfc.supabase.co',
            anonKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNpcGdueWtzaGF4cnh3ZGVzd2ZjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4OTA2MzMsImV4cCI6MjEwMjQ2NjYzM30.xJtq_3jNMLnXCyVSurdIuUnrlmZEyMWNO1-Azk_4k2E'
        };
        const supabaseClient = supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey);

        // ===== FILL LOGIN =====
        function fillLogin(email, password) {
            document.getElementById('email').value = email;
            document.getElementById('password').value = password;
            setTimeout(() => document.getElementById('loginForm').dispatchEvent(new Event('submit')), 300);
        }

        // ===== LOGIN =====
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('loginError');
            const loginBtn = document.getElementById('loginBtn');

            errorDiv.style.display = 'none';
            errorDiv.textContent = '';
            loginBtn.innerHTML = '<span class="spinner"></span> Logging in...';
            loginBtn.disabled = true;

            try {
                const { data: authData, error: authError } = await supabaseClient.auth
                    .signInWithPassword({ email, password });
                if (authError) throw new Error(authError.message);

                const { data: userData, error: userError } = await supabaseClient
                    .from('users')
                    .select('*, roles(name, permissions)')
                    .eq('email', email)
                    .single();

                if (userError || !userData) throw new Error('User profile not found');

                localStorage.setItem('viewpoint_session', JSON.stringify({ user: userData, session: authData.session }));

                const role = userData.roles?.name || 'cashier';
                const redirectMap = {
                    'admin': 'admin-dashboard.html',
                    'cashier': 'cashier-pos.html',
                    'butcher': 'sales-dashboard.html',
                    'kitchen': 'sales-dashboard.html'
                };
                window.location.href = redirectMap[role] || 'admin-dashboard.html';

            } catch (error) {
                errorDiv.textContent = error.message || 'Login failed. Please try again.';
                errorDiv.style.display = 'block';
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
                loginBtn.disabled = false;
            }
        });

        // ===== SESSION CHECK =====
        document.addEventListener('DOMContentLoaded', () => {
            const stored = localStorage.getItem('viewpoint_session');
            if (stored) {
                try {
                    const { user } = JSON.parse(stored);
                    if (user) {
                        const role = user.roles?.name || 'admin';
                        const redirectMap = {
                            'admin': 'admin-dashboard.html',
                            'cashier': 'cashier-pos.html',
                            'butcher': 'sales-dashboard.html',
                            'kitchen': 'sales-dashboard.html'
                        };
                        window.location.href = redirectMap[role] || 'admin-dashboard.html';
                    }
                } catch (e) {}
            }
        });
    </script>
</body>
</html>
