<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viewpoint POS - Ultimate Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ===== COMPLETE ULTIMATE STYLES ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #2563EB;
            --primary-light: #3B82F6;
            --primary-dark: #1D4ED8;
            --primary-gradient: linear-gradient(135deg, #2563EB, #3B82F6);
            --secondary: #1E293B;
            --success: #10B981;
            --danger: #EF4444;
            --warning: #F59E0B;
            --info: #3B82F6;
            --bg: #F8FAFC;
            --bg-card: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #475569;
            --text-muted: #94A3B8;
            --border: #E2E8F0;
            --shadow: 0 1px 3px rgba(0,0,0,0.06);
            --shadow-lg: 0 10px 40px rgba(0,0,0,0.08);
            --radius: 16px;
            --radius-sm: 10px;
            --radius-full: 9999px;
            --font: 'Inter', sans-serif;
            --transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
        }
        [data-theme="dark"] {
            --bg: #0F172A;
            --bg-card: #1E293B;
            --text-primary: #F1F5F9;
            --text-secondary: #94A3B8;
            --text-muted: #64748B;
            --border: #334155;
        }
        body { font-family: var(--font); background: var(--bg); color: var(--text-primary); min-height: 100vh; transition: var(--transition); overflow-x: hidden; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: var(--radius-full); }

        /* ===== SIDEBAR ===== */
        .sidebar { position: fixed; top: 0; left: 0; width: 250px; height: 100vh; background: var(--secondary); padding: 24px 16px; overflow-y: auto; z-index: 1000; transition: var(--transition); }
        .sidebar-brand { display: flex; align-items: center; gap: 12px; padding: 0 8px 20px; border-bottom: 1px solid rgba(255,255,255,0.08); margin-bottom: 20px; }
        .sidebar-brand .logo-icon { width: 44px; height: 44px; background: var(--primary-gradient); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 22px; color: #fff; flex-shrink: 0; box-shadow: 0 4px 12px rgba(108,60,225,0.3); }
        .sidebar-brand .brand-text { font-size: 20px; font-weight: 800; color: #fff; }
        .sidebar-brand .brand-sub { font-size: 11px; color: rgba(255,255,255,0.5); display: block; }
        .sidebar-menu { list-style: none; }
        .sidebar-menu .menu-label { font-size: 10px; font-weight: 700; color: rgba(255,255,255,0.3); text-transform: uppercase; letter-spacing: 0.8px; padding: 16px 12px 8px; }
        .sidebar-menu li { padding: 10px 14px; margin: 2px 0; border-radius: var(--radius-sm); cursor: pointer; transition: var(--transition); display: flex; align-items: center; gap: 14px; font-size: 14px; font-weight: 500; color: rgba(255,255,255,0.6); }
        .sidebar-menu li i { width: 20px; font-size: 16px; }
        .sidebar-menu li:hover { background: rgba(255,255,255,0.06); color: #fff; }
        .sidebar-menu li.active { background: var(--primary-gradient); color: #fff; box-shadow: 0 4px 16px rgba(108,60,225,0.3); }
        .sidebar-menu li .badge { margin-left: auto; background: rgba(255,255,255,0.2); color: #fff; padding: 0 10px; border-radius: var(--radius-full); font-size: 11px; font-weight: 600; }
        .sidebar-menu .logout-btn { margin-top: 16px; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 16px; color: rgba(255,255,255,0.5); }
        .sidebar-menu .logout-btn:hover { background: var(--danger); color: #fff; }
        .sidebar-toggle{display:none}
        .mobile-menu-btn{display:none;position:fixed;top:14px;left:14px;z-index:1201;height:44px;padding:0 14px;border:1px solid rgba(255,255,255,.14);border-radius:12px;background:var(--vp-navy,#0F172A);color:#fff;align-items:center;gap:9px;font-size:14px;font-weight:700;box-shadow:0 8px 24px rgba(15,23,42,.22);cursor:pointer}
        .mobile-menu-btn i{font-size:18px}
        .mobile-menu-btn:active{transform:scale(.97)}
        .mobile-sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(2,6,23,.5);backdrop-filter:blur(2px);z-index:1099;opacity:0;transition:opacity .2s ease}
        .mobile-sidebar-overlay.show{display:block;opacity:1}
        @media (max-width:768px){.mobile-menu-btn{display:flex}.main-content{padding-top:68px}.sidebar{z-index:1100;box-shadow:10px 0 35px rgba(15,23,42,.28)}.sidebar.open + .mobile-sidebar-overlay{display:block;opacity:1}}

        /* ===== MAIN CONTENT ===== */
        .main-content { margin-left: 250px; padding: 20px 28px 40px; min-height: 100vh; transition: var(--transition); }

        /* ===== TOP BAR ===== */
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 14px 24px; background: var(--bg-card); border-radius: var(--radius); border: 1px solid var(--border); margin-bottom: 24px; flex-wrap: wrap; gap: 12px; box-shadow: var(--shadow); transition: var(--transition); }
        .top-bar .page-title h1 { font-size: 22px; font-weight: 700; background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .top-bar .page-title p { font-size: 13px; color: var(--text-muted); margin-top: 2px; -webkit-text-fill-color: var(--text-muted); }
        .top-bar .page-actions { display: flex; align-items: center; gap: 12px; }
        .top-bar .page-actions .time-display { font-size: 13px; color: var(--text-secondary); background: var(--bg); padding: 6px 14px; border-radius: var(--radius-full); border: 1px solid var(--border); font-weight: 500; transition: var(--transition); }
        .theme-toggle { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-secondary); cursor: pointer; transition: var(--transition); display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .theme-toggle:hover { border-color: var(--primary); color: var(--primary); }
        .user-profile { display: flex; align-items: center; gap: 12px; padding-left: 16px; border-left: 1px solid var(--border); }
        .user-profile .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--primary-gradient); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; box-shadow: 0 4px 12px rgba(108,60,225,0.3); }
        .user-profile .user-name { font-size: 14px; font-weight: 600; transition: var(--transition); }
        .user-profile .user-role { font-size: 12px; color: var(--text-muted); transition: var(--transition); }

        /* ===== STATS ===== */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .stat-card { background: var(--bg-card); border-radius: var(--radius); padding: 20px 22px; border: 1px solid var(--border); transition: var(--transition); position: relative; overflow: hidden; }
        .stat-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
        .stat-card .stat-icon { width: 44px; height: 44px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 18px; margin-bottom: 10px; }
        .stat-card .stat-icon.purple { background: rgba(108,60,225,0.12); color: var(--primary); }
        .stat-card .stat-icon.green { background: rgba(16,185,129,0.12); color: var(--success); }
        .stat-card .stat-icon.orange { background: rgba(245,158,11,0.12); color: var(--warning); }
        .stat-card .stat-icon.blue { background: rgba(59,130,246,0.12); color: var(--info); }
        .stat-card .stat-icon.red { background: rgba(239,68,68,0.12); color: var(--danger); }
        .stat-card .stat-icon.pink { background: rgba(236,72,153,0.12); color: #EC4899; }
        .stat-card .stat-value { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; transition: var(--transition); }
        .stat-card .stat-label { font-size: 13px; color: var(--text-muted); margin-top: 4px; font-weight: 500; transition: var(--transition); }
        .stat-card .stat-change { font-size: 12px; font-weight: 600; margin-top: 6px; display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: var(--radius-full); }
        .stat-card .stat-change.up { background: rgba(16,185,129,0.12); color: var(--success); }
        .stat-card .stat-change.down { background: rgba(239,68,68,0.12); color: var(--danger); }
        .stat-card .stat-glow { position: absolute; top: -50%; right: -20%; width: 120px; height: 120px; border-radius: 50%; background: var(--primary-gradient); opacity: 0.04; pointer-events: none; }

        /* ===== CARDS ===== */
        .card { background: var(--bg-card); border-radius: var(--radius); padding: 22px 24px; border: 1px solid var(--border); transition: var(--transition); margin-bottom: 20px; box-shadow: var(--shadow); }
        .card:hover { box-shadow: var(--shadow-lg); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
        .card-header h3 { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; transition: var(--transition); }
        .card-header .card-action { font-size: 13px; color: var(--primary); font-weight: 600; cursor: pointer; background: none; border: none; transition: var(--transition); font-family: var(--font); }
        .card-header .card-action:hover { color: var(--primary-dark); transform: translateX(4px); }
        .grid-2 { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }

        /* ===== TABLES ===== */
        .table-wrapper { overflow-x: auto; border-radius: var(--radius-sm); }
        .data-table { width: 100%; border-collapse: collapse; font-size: 14px; }
        .data-table thead { background: var(--bg); }
        .data-table th { padding: 10px 14px; text-align: left; font-weight: 600; color: var(--text-secondary); font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border); transition: var(--transition); }
        .data-table td { padding: 10px 14px; border-bottom: 1px solid var(--border); color: var(--text-secondary); transition: var(--transition); }
        .data-table tbody tr:hover { background: var(--bg); }

        /* ===== BADGES ===== */
        .badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 12px; border-radius: var(--radius-full); font-size: 12px; font-weight: 600; }
        .badge.primary { background: rgba(108,60,225,0.12); color: var(--primary); }
        .badge.success { background: rgba(16,185,129,0.12); color: var(--success); }
        .badge.danger { background: rgba(239,68,68,0.12); color: var(--danger); }
        .badge.warning { background: rgba(245,158,11,0.12); color: var(--warning); }
        .badge.info { background: rgba(59,130,246,0.12); color: var(--info); }
        .badge.butchery { background: rgba(239,68,68,0.15); color: var(--danger); }
        .badge.restaurant { background: rgba(16,185,129,0.15); color: var(--success); }

        .status-badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 14px; border-radius: var(--radius-full); font-size: 12px; font-weight: 600; }
        .status-badge::before { content: ''; width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
        .status-badge.paid::before { background: var(--success); }
        .status-badge.pending::before { background: var(--warning); }
        .status-badge.preparing::before { background: var(--info); }
        .status-badge.ready::before { background: var(--primary); }
        .status-badge.completed::before { background: var(--success); }
        .status-badge.cancelled::before { background: var(--danger); }
        .status-badge.active::before { background: var(--success); }
        .status-badge.inactive::before { background: var(--danger); }

        /* ===== BUTTONS ===== */
        .btn { display: inline-flex; align-items: center; gap: 8px; padding: 9px 18px; border: none; border-radius: var(--radius-sm); font-weight: 600; font-size: 14px; cursor: pointer; transition: var(--transition); font-family: var(--font); }
        .btn-primary { background: var(--primary-gradient); color: #fff; box-shadow: 0 4px 12px rgba(108,60,225,0.3); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(108,60,225,0.4); }
        .btn-success { background: var(--success); color: #fff; box-shadow: 0 4px 12px rgba(16,185,129,0.3); }
        .btn-success:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(16,185,129,0.4); }
        .btn-danger { background: var(--danger); color: #fff; box-shadow: 0 4px 12px rgba(239,68,68,0.3); }
        .btn-danger:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(239,68,68,0.4); }
        .btn-warning { background: var(--warning); color: #fff; box-shadow: 0 4px 12px rgba(245,158,11,0.3); }
        .btn-warning:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(245,158,11,0.4); }
        .btn-outline { background: transparent; color: var(--text-secondary); border: 1px solid var(--border); }
        .btn-outline:hover { border-color: var(--primary); color: var(--primary); }
        .btn-sm { padding: 5px 12px; font-size: 12px; }
        .btn-block { width: 100%; justify-content: center; }

        /* ===== MODALS ===== */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(8px); z-index: 2000; justify-content: center; align-items: center; padding: 20px; }
        .modal-overlay.active { display: flex; }
        .modal { background: var(--bg-card); border-radius: var(--radius); max-width: 580px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 28px 32px; border: 1px solid var(--border); box-shadow: var(--shadow-lg); animation: slideUp 0.3s ease; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
        .modal-header h3 { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .modal-header .close { width: 36px; height: 36px; border-radius: 50%; border: none; background: var(--bg); color: var(--text-secondary); font-size: 18px; cursor: pointer; transition: var(--transition); display: flex; align-items: center; justify-content: center; }
        .modal-header .close:hover { background: var(--danger); color: #fff; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-weight: 600; font-size: 13px; color: var(--text-secondary); margin-bottom: 4px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 14px; font-family: var(--font); background: var(--bg); color: var(--text-primary); transition: var(--transition); }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(108,60,225,0.1); }

       /* ===== EMOJI PICKER ===== */
.emoji-picker {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 4px;
    padding: 8px;
    background: var(--bg);
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    max-height: 250px;
    overflow-y: auto;
}

.emoji-picker::-webkit-scrollbar {
    width: 4px;
}

.emoji-picker::-webkit-scrollbar-thumb {
    background: var(--primary);
    border-radius: var(--radius-full);
}

.emoji-picker .emoji-option {
    display: flex !important;
    align-items: center !important;
    gap: 8px !important;
    padding: 6px 10px !important;
    font-size: 20px !important;
    cursor: pointer;
    border-radius: 8px;
    transition: all 0.2s ease;
    border: 2px solid transparent;
    background: transparent;
    min-height: 44px;
}

.emoji-picker .emoji-option:hover {
    background: rgba(108, 60, 225, 0.08) !important;
    transform: scale(1.02);
    border-color: rgba(108, 60, 225, 0.2);
}

.emoji-picker .emoji-option.selected {
    border-color: var(--primary) !important;
    background: rgba(108, 60, 225, 0.1) !important;
    box-shadow: 0 0 20px rgba(108, 60, 225, 0.1);
}

.emoji-picker .emoji-option .emoji-char {
    font-size: 28px;
    flex-shrink: 0;
    width: 36px;
    text-align: center;
}

.emoji-picker .emoji-option .emoji-name {
    font-size: 12px;
    color: var(--text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-weight: 500;
}

.emoji-picker .emoji-option.selected .emoji-name {
    color: var(--primary);
}

.selected-emoji-display {
    font-size: 72px;
    text-align: center;
    padding: 16px;
    background: var(--bg);
    border-radius: var(--radius-sm);
    border: 2px dashed var(--border);
    min-height: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: var(--transition);
}

.selected-emoji-display:hover {
    border-color: var(--primary);
    background: rgba(108, 60, 225, 0.03);
}

.product-image-preview {
    width: 80px;
    height: 80px;
    border-radius: var(--radius-sm);
    object-fit: cover;
    border: 2px solid var(--border);
    background: var(--bg);
}

.product-image-upload {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
}

/* ===== RESPONSIVE EMOJI PICKER ===== */
@media (max-width: 768px) {
    .emoji-picker {
        grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
        max-height: 200px;
    }
    
    .emoji-picker .emoji-option {
        padding: 4px 8px !important;
        gap: 6px !important;
        min-height: 38px;
    }
    
    .emoji-picker .emoji-option .emoji-char {
        font-size: 24px;
        width: 30px;
    }
    
    .emoji-picker .emoji-option .emoji-name {
        font-size: 11px;
    }
    
    .selected-emoji-display {
        font-size: 56px;
        min-height: 80px;
        padding: 12px;
    }
}

@media (max-width: 480px) {
    .emoji-picker {
        grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
        max-height: 160px;
        padding: 4px;
        gap: 2px;
    }
    
    .emoji-picker .emoji-option {
        padding: 4px 6px !important;
        flex-direction: column !important;
        gap: 2px !important;
        min-height: 48px;
        justify-content: center !important;
    }
    
    .emoji-picker .emoji-option .emoji-char {
        font-size: 22px;
        width: 100%;
    }
    
    .emoji-picker .emoji-option .emoji-name {
        font-size: 9px;
        white-space: normal;
        text-align: center;
        line-height: 1.2;
    }
    
    .selected-emoji-display {
        font-size: 44px;
        min-height: 60px;
        padding: 8px;
    }
}

        /* ===== TOAST ===== */
        .toast-container { position: fixed; top: 24px; right: 24px; z-index: 3000; display: flex; flex-direction: column; gap: 10px; max-width: 400px; }
        .toast { padding: 14px 20px; border-radius: var(--radius-sm); color: #fff; font-weight: 500; font-size: 14px; box-shadow: var(--shadow-lg); animation: slideInRight 0.4s ease; display: flex; align-items: center; gap: 12px; border: 1px solid rgba(255,255,255,0.1); }
        .toast.success { background: var(--success); }
        .toast.error { background: var(--danger); }
        .toast.info { background: var(--primary); }
        .toast.warning { background: var(--warning); }

        /* ===== PAYMENT STATUS ===== */
        .payment-status { text-align: center; padding: 20px 0; }
        .payment-status .spinner {
            display: inline-block;
            width: 50px;
            height: 50px;
            border: 4px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 20px auto;
        }
        .payment-status .status-icon { font-size: 48px; margin-bottom: 12px; }
        .payment-status .status-icon.success { color: var(--success); }
        .payment-status .status-icon.failed { color: var(--danger); }
        .payment-status .status-text { font-size: 16px; font-weight: 600; color: var(--text-primary); }
        .payment-status .status-sub { font-size: 14px; color: var(--text-muted); margin-top: 4px; }

        /* ===== ANIMATIONS ===== */
        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes slideInRight { from { transform: translateX(100px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.7s linear infinite; }

        /* ===== SECTION PAGES ===== */
        .section-page { display: none; animation: fadeIn 0.4s ease; }
        .section-page.active { display: block; }

        /* ===== EMPTY STATE ===== */
        .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); }
        .empty-state i { font-size: 44px; margin-bottom: 12px; opacity: 0.3; }
        .empty-state h4 { font-size: 18px; color: var(--text-secondary); margin-bottom: 6px; }
        .empty-state p { font-size: 14px; }

        /* ===== FILTER TABS ===== */
        .filter-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
        .filter-tabs .filter-btn { padding: 5px 14px; border: 1px solid var(--border); border-radius: var(--radius-full); background: var(--bg-card); color: var(--text-secondary); cursor: pointer; font-size: 13px; font-weight: 500; transition: var(--transition); font-family: var(--font); }
        .filter-tabs .filter-btn:hover { border-color: var(--primary); color: var(--primary); }
        .filter-tabs .filter-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
        .filter-tabs .filter-btn .count { background: rgba(0,0,0,0.08); padding: 0 8px; border-radius: var(--radius-full); font-size: 11px; margin-left: 4px; }
        .filter-tabs .filter-btn.active .count { background: rgba(255,255,255,0.2); }

        /* ===== ORDER CARDS ===== */

// ============================================================
function selectEmoji(emoji) {
    currentProductEmoji = emoji;
    const display = document.getElementById('selectedEmojiDisplay');
    const input = document.getElementById('productEmoji');
    if (display) display.textContent = emoji;
    if (input) input.value = emoji;
    
    // Highlight selected
    document.querySelectorAll('.emoji-option').forEach(el => {
        el.classList.toggle('selected', el.dataset.emoji === emoji);
        if (el.dataset.emoji === emoji) {
            el.style.borderColor = 'var(--primary)';
            el.style.background = 'rgba(108,60,225,0.1)';
        } else {
            el.style.borderColor = 'transparent';
            el.style.background = 'transparent';
        }
    });
    
    const container = document.getElementById('emojiPickerContainer');
    if (container) container.style.display = 'none';
}

// ============================================================
//  TOAST SYSTEM
// ============================================================
function showToast(message, type = 'success') {
    const container = document.getElementById('toastContainer');
    if (!container) {
        console.log('Toast:', message, type);
        return;
    }
    const icons = {
        success: 'fa-check-circle',
        error: 'fa-exclamation-circle',
        info: 'fa-info-circle',
        warning: 'fa-exclamation-triangle'
    };
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.innerHTML = `<i class="fas ${icons[type] || icons.info}"></i> ${message}`;
    container.appendChild(toast);
    setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(100px)';
        toast.style.transition = 'all 0.4s ease';
        setTimeout(() => toast.remove(), 400);
    }, 3500);
}

// ============================================================
//  NOTIFICATION SYSTEM
// ============================================================
function addNotification(title, message, type = 'info', link = null) {
    const id = Date.now().toString();
    notifications.unshift({
        id, title, message, type, link,
        read: false,
        created_at: new Date().toISOString()
    });
    unreadCount++;
    updateNotificationBadge();
    renderNotifications();
    showToast(message, type);
}

function updateNotificationBadge() {
    const badge = document.getElementById('notificationBadge');
    if (badge) {
        badge.textContent = unreadCount;
        badge.style.display = unreadCount > 0 ? 'inline' : 'none';
    }
}

function renderNotifications() {
    const container = document.getElementById('notificationList');
    if (!container) return;
    if (!notifications.length) {
        container.innerHTML = '<div class="empty-state" style="padding:20px;"><p>No notifications</p></div>';
        return;
    }
    container.innerHTML = notifications.slice(0, 10).map(n => `
        <div class="notification-item ${n.read ? 'read' : 'unread'}" 
             onclick="${n.link ? `navigateTo('${n.link}')` : ''}"
             style="padding:10px 14px;border-bottom:1px solid var(--border);
                    cursor:${n.link ? 'pointer' : 'default'};
                    background:${n.read ? 'transparent' : 'rgba(108,60,225,0.05)'};
                    transition:var(--transition);">
            <div style="display:flex;align-items:center;gap:8px;">
                <span style="font-size:18px;">${n.type === 'success' ? '✅' : n.type === 'error' ? '❌' : n.type === 'warning' ? '⚠️' : 'ℹ️'}</span>
                <div style="flex:1;">
                    <div style="font-weight:600;font-size:13px;">${n.title}</div>
                    <div style="font-size:12px;color:var(--text-muted);">${n.message}</div>
                    <div style="font-size:10px;color:var(--text-muted);margin-top:2px;">${new Date(n.created_at).toLocaleString()}</div>
                </div>
                ${!n.read ? `<span style="width:8px;height:8px;border-radius:50%;background:var(--primary);flex-shrink:0;"></span>` : ''}
            </div>
        </div>
    `).join('');
}

function markAllNotificationsRead() {
    notifications.forEach(n => n.read = true);
    unreadCount = 0;
    updateNotificationBadge();
    renderNotifications();
}

// ============================================================
function resetSessionTimer() {
    if (sessionTimer) clearTimeout(sessionTimer);
    const timeout = parseInt(document.getElementById('sessionTimeout')?.value || 30) * 60 * 1000;
    sessionTimer = setTimeout(() => {
        showToast('⚠️ Session expired. Please login again.', 'warning');
        addNotification('Session Expired', 'Your session has expired due to inactivity.', 'warning');
        logout();
    }, timeout);
}

// ============================================================
//  AUTH - FIXED FOR PIN LOGIN
// ============================================================
async function checkAuth() {
    try {
        const stored = localStorage.getItem('viewpoint_session');
        if (!stored) {
            console.log('❌ No session found');
            window.location.href = 'index.html';
            return null;
        }

        let sessionData;
        try {
            sessionData = JSON.parse(stored);
        } catch (e) {
            localStorage.removeItem('viewpoint_session');
            window.location.href = 'index.html';
            return null;
        }

        const { user, loginMethod, loginTime } = sessionData;

        if (!user) {
            localStorage.removeItem('viewpoint_session');
            window.location.href = 'index.html';
            return null;
        }

        const maxAge = 24 * 60 * 60 * 1000;
        if (loginTime && Date.now() - loginTime > maxAge) {
            localStorage.removeItem('viewpoint_session');
            window.location.href = 'index.html';
            return null;
        }

        console.log('✅ User authenticated:', user.email);
        console.log('🔑 Login method:', loginMethod || 'email');

        // ✅ Set current user
        currentUser = user;
        
        // ✅ Update UI with user info
        updateUI(user);
        resetSessionTimer();

        // ✅ If PIN login, verify user is still active in database
        if (loginMethod === 'pin') {
            try {
                const { data: dbUser, error } = await supabaseClient
                    .from('users')
                    .select('id, email, full_name, role_id, status, pin_enabled')
                    .eq('id', user.id)
                    .single();
                
                if (error || !dbUser || dbUser.status !== 'active') {
                    console.log('❌ User no longer active or not found');
                    localStorage.removeItem('viewpoint_session');
                    window.location.href = 'index.html';
                    return null;
                }
                
                // ✅ Update current user with fresh data
                currentUser = { ...user, ...dbUser };
                
            } catch (e) {
                // If we can't verify, keep the session but log it
                console.log('⚠️ Could not verify user in database, but session is valid');
            }
        }

        return currentUser;

    } catch (error) {
        console.error('❌ Auth error:', error);
        localStorage.removeItem('viewpoint_session');
        window.location.href = 'index.html';
        return null;
    }
}
function updateUI(user) {
    const avatar = document.getElementById('userAvatar');
    const userName = document.getElementById('userName');
    const userRole = document.querySelector('.user-role');
    
    if (avatar) avatar.textContent = user.full_name?.charAt(0).toUpperCase() || 'A';
    if (userName) userName.textContent = user.full_name || 'User';
    if (userRole) userRole.textContent = user.roles?.name || 'Cashier';
}

async function logout() {
    try {
        if (typeof supabaseClient !== 'undefined' && supabaseClient.auth) {
            await supabaseClient.auth.signOut().catch(() => {});
        }
    } catch (e) {}
    localStorage.removeItem('viewpoint_session');
    window.location.href = 'index.html';
}
window.logout = logout;

        let ip = 'unknown';
        try {
            const response = await fetch('https://api.ipify.org?format=json');
            const data = await response.json();
            ip = data.ip;
        } catch (e) {
            // IP fetch failed, use 'unknown'
        }
        
        // ✅ Log to audit_logs table (not user_activity_log)
        const { error } = await supabaseClient
            .from('audit_logs')
            .insert({
                user_id: currentUser.id,
                action: action,
                details: details || '',
                entity_type: entityType || '',
                entity_id: entityId || '',
                new_value: newValue || null,
                old_value: oldValue || null,
                ip_address: ip,
                user_agent: navigator.userAgent || 'unknown',
                created_at: new Date().toISOString()
            });
            
        if (error) {
            console.error('❌ Audit log error:', error);
        } else {
            console.log(`✅ Audit: ${action} by ${currentUser.full_name || currentUser.email}`);
        }
        
    } catch (e) {
        console.log('⚠️ Audit log skipped:', e.message);
    }
}

async function getIPAddress() {
    try {
        const response = await fetch('https://api.ipify.org?format=json');
        const data = await response.json();
        return data.ip;
    } catch (e) {
        return 'unknown';
    }
}

function getTimeBasedGreeting() {
    const now = new Date();
    const hour = now.getHours();
    
    if (hour >= 5 && hour < 12) {
        return {
            greeting: 'Good Morning',
            emoji: '🌅',
            message: 'Rise and shine! Start your day with Viewpoint POS.',
            gradient: 'linear-gradient(135deg, #F59E0B, #F97316)'
        };
    } else if (hour >= 12 && hour < 17) {
        return {
            greeting: 'Good Afternoon',
            emoji: '☀️',
            message: 'Keep the momentum going! You\'re doing great.',
            gradient: 'linear-gradient(135deg, #3B82F6, #3B82F6)'
        };
    } else if (hour >= 17 && hour < 21) {
        return {
            greeting: 'Good Evening',
            emoji: '🌅',
            message: 'Wind down and finish strong!',
            gradient: 'linear-gradient(135deg, #EF4444, #3B82F6)'
        };
    } else {
        return {
            greeting: 'Good Night',
            emoji: '🌙',
            message: 'Late night hustle! Don\'t forget to rest.',
            gradient: 'linear-gradient(135deg, #1E293B, #0F172A)'
        };
    }
}

function getCurrentDateString() {

}

async function uploadProductImage(file) {
    try {
        const fileExt = file.name.split('.').pop();
        const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.${fileExt}`;
        const filePath = `products/${fileName}`;
        
        const { data, error } = await supabaseClient.storage
            .from('product-images')
            .upload(filePath, file);
            
        if (error) throw error;
        
        const { data: urlData } = supabaseClient.storage
            .from('product-images')
            .getPublicUrl(filePath);
            
        return urlData.publicUrl;
        
    } catch (error) {
        console.error('Image upload error:', error);
        showToast('❌ Image upload failed: ' + error.message, 'error');
        return null;
    }
}

function handleProductImageUpload(event) {
    const file = event.target.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = function(e) {
        const preview = document.getElementById('productImagePreview');
        if (preview) {
            preview.src = e.target.result;
            preview.style.display = 'block';
            const clearBtn = document.getElementById('clearImageBtn');
            if (clearBtn) clearBtn.style.display = 'inline-flex';
        }
    };
    reader.readAsDataURL(file);
    currentProductImageFile = file;
}

function clearProductImage() {
    currentProductImageFile = null;
    const preview = document.getElementById('productImagePreview');
    const fileInput = document.getElementById('productImageFile');
    const clearBtn = document.getElementById('clearImageBtn');
    const urlInput = document.getElementById('productImageUrl');
    if (preview) { preview.src = ''; preview.style.display = 'none'; }
    if (fileInput) fileInput.value = '';
    if (clearBtn) clearBtn.style.display = 'none';
    if (urlInput) urlInput.value = '';
}

async function loadDashboard() {
    try {
        const today = new Date().toISOString().split('T')[0];
        const { data: orders } = await supabaseClient.from('orders').select('*').gte('created_at', today);

        let total = 0, butchery = 0, restaurant = 0, mpesa = 0, pending = 0;
        orders?.forEach(o => {
            if (o.status === 'paid' || o.status === 'completed') {
                total += o.total || 0;
                if (o.order_type === 'butchery') butchery += o.total || 0;
                else restaurant += o.total || 0;
                if (o.payment_method === 'mpesa') mpesa += o.total || 0;
            }
            if (o.status === 'paid' || o.status === 'preparing') pending++;
        });

        const setText = (id, val) => {
            const el = document.getElementById(id);
            if (el) el.textContent = val;
        };
        setText('todaySales', `KES ${total.toFixed(2)}`);
        setText('butcherySales', `KES ${butchery.toFixed(2)}`);
        setText('restaurantSales', `KES ${restaurant.toFixed(2)}`);
        setText('mpesaSales', `KES ${mpesa.toFixed(2)}`);
        setText('pendingOrders', pending);

        const { data: productsData } = await supabaseClient.from('products').select('stock_quantity, reorder_level');
        const low = productsData?.filter(p => p.stock_quantity <= p.reorder_level) || [];
        setText('lowStock', low.length);

        await loadRecentOrders();
        await loadTopProducts();
        await createSalesChart(orders || []);
        await loadEnhancedDashboardCharts(orders || []);
        
        // ✅ Load Profit & Loss data for dashboard
        await loadProfitData();
        await loadProfitBreakdown();

        if (low.length > 0) {
            showToast(`⚠️ ${low.length} items are low on stock!`, 'warning');
            addNotification('Low Stock Alert', `${low.length} items are low on stock. Please restock.`, 'warning', 'inventory');
        }
    } catch (e) {
        console.error('Dashboard error:', e);
    }
}

async function loadTopProducts() {
    try {
        const list = document.getElementById('topProductsList');
        if (!list) return;
        let items = [];
        
        try {
            const { data, error } = await supabaseClient
                .from('order_items')
                .select('product_id, quantity, products(name, emoji)')
                .limit(30);
            if (!error) items = data || [];
        } catch (e) {
            console.log('Could not fetch order_items:', e.message);
        }
        
        if (!items || !items.length) {
            list.innerHTML = '<div class="empty-state"><p>No sales data yet</p></div>';
            return;
        }
        
        const counts = {};
        items.forEach(item => {
            const name = item.products?.name || 'Unknown';
            counts[name] = (counts[name] || 0) + (item.quantity || 0);
        });
        
        const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 5);
        if (!sorted.length) {
            list.innerHTML = '<div class="empty-state"><p>No sales data yet</p></div>';
            return;
        }
        
        const colors = ['#2563EB', '#10B981', '#F59E0B', '#EF4444', '#3B82F6'];
        list.innerHTML = sorted.map(([name, qty], i) => {
            const emoji = items.find(it => it.products?.name === name)?.products?.emoji || getEmoji(name);
            return `
                <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);">
                    <div style="display:flex;align-items:center;gap:10px;">
                        <span style="display:inline-flex;width:26px;height:26px;border-radius:50%;background:${colors[i]};color:#fff;align-items:center;justify-content:center;font-weight:700;font-size:12px;">${i+1}</span>
                        <span style="font-weight:500;">${emoji} ${name}</span>
                    </div>
                    <span style="font-weight:700;color:var(--primary);">${qty.toFixed(1)}</span>
                </div>
            `;
        }).join('');
    } catch (e) {
        console.error('Top products error:', e);
        const list = document.getElementById('topProductsList');
        if (list) list.innerHTML = '<div class="empty-state"><p>Could not load top products</p></div>';
    }
}

async function createSalesChart(orders) {
    try {
        const ctx = document.getElementById('salesChart');
        if (!ctx) return;
        const daily = {};
        orders.forEach(o => {
            const d = new Date(o.created_at).toLocaleDateString();
            daily[d] = (daily[d] || 0) + (o.total || 0);
        });
        if (salesChart) salesChart.destroy();
        salesChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: Object.keys(daily).length ? Object.keys(daily) : ['No Data'],
                datasets: [{
                    label: 'Sales (KES)',
                    data: Object.values(daily).length ? Object.values(daily) : [0],
                    borderColor: '#2563EB',
                    backgroundColor: 'rgba(108,60,225,0.08)',
                    fill: true,
                    tension: 0.4,
                    pointBackgroundColor: '#2563EB',
                    pointBorderColor: '#fff',
                    pointBorderWidth: 2,
                    pointRadius: 4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                plugins: { legend: { display: false } },
                scales: {
                    y: { beginAtZero: true, ticks: { callback: function(value) { return 'KES ' + value.toLocaleString(); } } }
                }
            }
        });
    } catch (e) {
        console.error('Chart error:', e);
    }
}

async function loadPOSProducts(type) {

            .eq('is_active', true);

            container.innerHTML = `<div class="empty-state"><i class="fas fa-box-open"></i><p>No ${type} products available</p></div>`;
            return;
        }

        let html = `
            <div class="product-grid">
                ${products.map(p => `
                    <div class="product-card" onclick="selectPOSProduct('${p.id}')" id="pos-${p.id}">
                        <span class="product-emoji">${p.emoji || getEmoji(p.name)}</span>

function selectPOSProduct(id) {
    selectedProduct = id;
    document.querySelectorAll('.product-card').forEach(el => el.classList.remove('selected'));
    const el = document.getElementById(`pos-${id}`);
    if (el) el.classList.add('selected');
}

function quickAmount(amount) {
    const el = document.getElementById('posAmount');
    if (el) { el.value = amount || ''; calculateTotalPOS(); }
}

function calculateTotalPOS() {
    const qty = parseFloat(document.getElementById('posQty')?.value) || 0;
    const amount = parseFloat(document.getElementById('posAmount')?.value) || 0;
    if (!selectedProduct) return;
    const product = products.find(p => p.id === selectedProduct);
    if (!product) return;
    if (amount && !qty) {
        const qtyEl = document.getElementById('posQty');
        if (qtyEl) qtyEl.value = (amount / product.selling_price).toFixed(3);
    } else if (qty && !amount) {
        const amountEl = document.getElementById('posAmount');
        if (amountEl) amountEl.value = (qty * product.selling_price).toFixed(2);
    }
}

function addToCartPOS() {
    if (!selectedProduct) { showToast('Select a product first', 'warning'); return; }
    const product = products.find(p => p.id === selectedProduct);
    if (!product) return;
    const qtyInput = parseFloat(document.getElementById('posQty')?.value) || 0;
    const amountInput = parseFloat(document.getElementById('posAmount')?.value) || 0;
    if (!qtyInput && !amountInput) { showToast('Enter quantity or amount', 'warning'); return; }

    const quantity = qtyInput || (amountInput / Number(product.selling_price || 0));
    const total = amountInput || (quantity * Number(product.selling_price || 0));
    if (!Number.isFinite(quantity) || quantity <= 0 || !Number.isFinite(total) || total <= 0) {
        showToast('Enter a valid quantity or amount', 'warning'); return;
    }
    if (Number(product.stock_quantity || 0) < quantity) {
        showToast(`Only ${product.stock_quantity} ${product.unit || 'units'} available`, 'warning'); return;
    }

    const item = {
        product_id: product.id,
        id: product.id,
        name: product.name,
        quantity,
        qty: quantity,
        total,
        unit_price: Number(product.selling_price || 0),
        price: Number(product.selling_price || 0),
        emoji: product.emoji || getEmoji(product.name),
        unit: product.unit || '',
        sku: product.sku || '',
        barcode: product.barcode || ''
    };

    // Keep the original backend cart as the single payment source.
    const existing = cart.find(x => String(x.product_id) === String(product.id));
    if (existing) {
        existing.quantity = Number(existing.quantity || 0) + quantity;
        existing.total = Number(existing.total || 0) + total;
        existing.qty = existing.quantity;
    } else {
        cart.push(item);
    }
    updateCartDisplayPOS();

    // Mirror the same cart into the upgraded Current Sale panel.
    if (typeof window.syncUltimateCartFromLegacy === 'function') window.syncUltimateCartFromLegacy(cart);

    showToast(`✅ ${product.name} added to cart`, 'success');
    const qtyEl = document.getElementById('posQty');
    const amountEl = document.getElementById('posAmount');
    if (qtyEl) qtyEl.value = '';
    if (amountEl) amountEl.value = '';
    selectedProduct = null;
    document.querySelectorAll('.product-card').forEach(el => el.classList.remove('selected'));
}

function clearCartPOS() {
    cart = [];
    updateCartDisplayPOS();
    if (typeof window.clearPOSCart === 'function') window.clearPOSCart();
}

function updateCartDisplayPOS() {
    const container = document.getElementById('posCartItems');
    const totalEl = document.getElementById('posTotal');
    if (!container || !totalEl) return;
    if (!cart.length) {
        container.innerHTML = '<div class="empty-state" style="padding:8px;"><p>No items in cart</p></div>';
        totalEl.textContent = 'KES 0.00';
        return;
    }
    let total = 0;
    container.innerHTML = cart.map((item, i) => {
        total += item.total;
        return `<div class="pos-cart-item">
                    <span>${item.emoji} ${item.name} × ${item.quantity.toFixed(3)}</span>
                    <span style="font-weight:600;">KES ${item.total.toFixed(2)}</span>
                    <button class="remove-btn" onclick="cart.splice(${i},1);updateCartDisplayPOS();">&times;</button>
                </div>`;
    }).join('');
    totalEl.textContent = `KES ${total.toFixed(2)}`;
}

            container.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Could not load orders</p></div>';

function renderOrders(orders) {
    let filtered = orders;
    if (currentFilter === 'butchery') filtered = orders.filter(o => o.order_type === 'butchery');
    else if (currentFilter === 'restaurant') filtered = orders.filter(o => o.order_type === 'restaurant');
    else if (['paid', 'preparing', 'ready', 'completed'].includes(currentFilter)) {
        filtered = orders.filter(o => o.status === currentFilter);
    }
    const container = document.getElementById('ordersContainer');
    const countEl = document.getElementById('orderCount');
    if (!container) return;
    if (countEl) countEl.textContent = filtered.length;
    
    if (!filtered.length) {
        container.innerHTML = `<div class="empty-state"><i class="fas fa-inbox"></i><p>No ${currentFilter === 'all' ? '' : currentFilter} orders</p></div>`;
        return;
    }
    container.innerHTML = `<div class="orders-grid">${filtered.map(order => {
        const items = order.order_items || [];
        return `
                <div class="order-card">
                    <div class="order-header">
                        <span class="order-number">#${order.order_number || order.id.slice(0,10)}</span>

                        <span class="status-badge ${order.status}">${order.status}</span>
                    </div>

                                <span>${(item.quantity || 0).toFixed(3)} ${item.products?.unit || ''}</span>

                    </div>
                    <div class="order-footer">
                        <span class="order-total">KES ${(order.total || 0).toFixed(2)}</span>
                        <span class="order-time">${new Date(order.created_at).toLocaleTimeString()}</span>

                        ${order.status === 'preparing' ? `<button class="btn btn-sm btn-success" onclick="updateOrderStatus('${order.id}','ready')"><i class="fas fa-check"></i> Ready</button>` : ''}

function updateOrderCounts(orders) {
    const setCount = (id, val) => {

        if (el) el.textContent = val;
    };
    setCount('countAll', orders.length);

    setCount('countPreparing', orders.filter(o => o.status === 'preparing').length);
    setCount('countReady', orders.filter(o => o.status === 'ready').length);

async function editProduct(id) {
    try {
        const { data: p } = await supabaseClient.from('products').select('*').eq('id', id).single();
        if (!p) return;
        const titleEl = document.getElementById('productModalTitle');
        if (titleEl) titleEl.textContent = 'Edit Product';
        const idEl = document.getElementById('productId');
        if (idEl) idEl.value = p.id;
        const nameEl = document.getElementById('productName');
        const typeEl = document.getElementById('productType');
        const priceEl = document.getElementById('productPrice');
        const costEl = document.getElementById('productCost');
        const unitEl = document.getElementById('productUnit');
        const stockEl = document.getElementById('productStock');
        const reorderEl = document.getElementById('productReorder');
        const statusEl = document.getElementById('productStatus');
        if (nameEl) nameEl.value = p.name;
        if (typeEl) typeEl.value = p.product_type;
        if (priceEl) priceEl.value = p.selling_price;
        if (costEl) costEl.value = p.cost_price || '';
        if (unitEl) unitEl.value = p.unit;
        if (stockEl) stockEl.value = p.stock_quantity;
        if (reorderEl) reorderEl.value = p.reorder_level;
        if (statusEl) statusEl.value = p.is_active ? 'active' : 'inactive';
        
        if (p.emoji) {
            currentProductEmoji = p.emoji;
            const display = document.getElementById('selectedEmojiDisplay');
            const input = document.getElementById('productEmoji');
            if (display) display.textContent = p.emoji;
            if (input) input.value = p.emoji;
        }
        
        if (p.image_url) {
            const preview = document.getElementById('productImagePreview');
            const urlInput = document.getElementById('productImageUrl');
            if (preview) { preview.src = p.image_url; preview.style.display = 'block'; }
            if (urlInput) urlInput.value = p.image_url;
        }
        
        openModal('productModal');
    } catch (e) {
        console.error('Edit product error:', e);
        showToast('❌ Could not load product', 'error');
    }
}

async function deleteProduct(id) {

    try {
        await supabaseClient.from('products').delete().eq('id', id);
        showToast('Product deleted', 'success');
        loadProducts();
    } catch (e) {
        showToast('❌ Could not delete product', 'error');

}

document.getElementById('productForm')?.addEventListener('submit', async (e) => {
    e.preventDefault();
    const id = document.getElementById('productId')?.value;
    
    let imageUrl = document.getElementById('productImageUrl')?.value || '';
    if (currentProductImageFile) {
        const uploadedUrl = await uploadProductImage(currentProductImageFile);
        if (uploadedUrl) imageUrl = uploadedUrl;
    }
    
    const data = {
        name: document.getElementById('productName')?.value || '',
        product_type: document.getElementById('productType')?.value || 'butchery',
        selling_price: parseFloat(document.getElementById('productPrice')?.value) || 0,
        cost_price: parseFloat(document.getElementById('productCost')?.value) || null,
        unit: document.getElementById('productUnit')?.value || 'KG',
        stock_quantity: parseFloat(document.getElementById('productStock')?.value) || 0,
        reorder_level: parseFloat(document.getElementById('productReorder')?.value) || 0,
        emoji: document.getElementById('productEmoji')?.value || '📦',
        image_url: imageUrl || null,
        is_active: document.getElementById('productStatus')?.value === 'active'
    };
    
    try {
        if (id) {
            await supabaseClient.from('products').update(data).eq('id', id);

            await supabaseClient.from('products').insert(data);
            showToast('✅ Product created!', 'success');

        closeModal('productModal');

    } catch (e) {

async function loadStockMovements() {

            .order('created_at', { ascending: false })
            .limit(15);

            movementTable.innerHTML = '<div class="empty-state"><p>No movements</p></div>';

        movements.forEach(m => {
            const isAdd = m.quantity > 0;
            const productName = m.products?.name || 'Unknown';
            const productEmoji = m.products?.emoji || getEmoji(productName);
            mHtml += `<tr>
                <td>${productEmoji} ${productName}</td>
                <td><span class="badge ${isAdd ? 'success' : 'danger'}">${isAdd ? '➕ Restock' : '➖ Sale'}</span></td>

            </tr>`;
        });
        mHtml += '</tbody></table></div>';
        movementTable.innerHTML = mHtml;
    } catch (e) {
        console.error('Stock movements error:', e);
    }
}

document.getElementById('userForm')?.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('userSubmitBtn');
    if (!btn) return;
    btn.innerHTML = '<span class="spinner"></span> Creating...';
    btn.disabled = true;
    try {
        const fullName = document.getElementById('userFullName')?.value?.trim() || '';
        const email = document.getElementById('userEmail')?.value?.trim() || '';
        const password = document.getElementById('userPassword')?.value || '';
        const roleId = parseInt(document.getElementById('userRole')?.value) || 0;
        const twoFA = parseInt(document.getElementById('user2FA')?.value) || 0;
        const status = document.getElementById('userStatus')?.value || 'active';
        const phone = document.getElementById('userPhone')?.value || '';
        const pin = document.getElementById('userPin')?.value || '';

        if (!fullName || !email || !password || !roleId) throw new Error('Fill all required fields');
        if (pin.length !== 4 || !/^\d{4}$/.test(pin)) {
            throw new Error('PIN must be exactly 4 digits');
        }

        // Create auth user
        const { data: authData, error: authError } = await supabaseClient.auth.admin.createUser({
            email: email,
            password: password,
            email_confirm: true,
            user_metadata: {
                full_name: fullName,
                phone: phone || ''
            }
        });

        if (authError) {
            const { data: signUpData, error: signUpError } = await supabaseClient.auth.signUp({
                email: email,
                password: password,
                options: {
                    email_confirm: false,
                    data: {
                        full_name: fullName,
                        phone: phone || ''
                    }
                }
            });
            if (signUpError) throw new Error(signUpError.message);
            var userId = signUpData.user.id;
        } else {
            var userId = authData.user.id;
        }

        const username = email.replace(/[^a-zA-Z0-9]/g, '_').toLowerCase();
        const { error: insertError } = await supabaseClient.from('users').insert({
            id: userId,
            username: username,
            email: email,
            full_name: fullName,
            phone: phone || null,
            role_id: roleId,
            status: status,
            pin: pin,  // ✅ Using 'pin' column
            pin_enabled: true,  // ✅ Enable PIN
            pin_updated_at: new Date().toISOString(),
            two_fa_enabled: twoFA === 1,
            email_verified: true,
            created_at: new Date().toISOString(),
            updated_at: new Date().toISOString()
        });

        if (insertError) throw new Error(insertError.message);

        showToast(`✅ User "${fullName}" created with PIN!`, 'success');
        addNotification('User Created', `User "${fullName}" created successfully.`, 'success', 'users');
        closeModal('userModal');
        loadUsers();

    } catch (error) {
        console.error('Create user error:', error);
        showToast('❌ ' + error.message, 'error');
    } finally {
        btn.innerHTML = '<i class="fas fa-save"></i> Create User';
        btn.disabled = false;
    }
});

async function loadProfitData() {
    try {
        console.log('💰 Loading profit & loss data...');
        
        // Get all PAID orders with their items and products
        const { data: orders, error: ordersError } = await supabaseClient
            .from('orders')
            .select('*, order_items(*, products(*))')
            .eq('status', 'paid');
            
        if (ordersError) {
            console.error('Orders error:', ordersError);
            showToast('❌ Could not load profit data', 'error');
            return;
        }

        console.log(`📊 Found ${orders?.length || 0} paid orders`);

        let revenue = 0;
        let cost = 0;
        
        // Calculate totals
        if (orders && orders.length > 0) {
            orders.forEach(order => {
                // Add order total to revenue
                revenue += order.total || 0;
                
                // Calculate cost from order items
                if (order.order_items && order.order_items.length > 0) {
                    order.order_items.forEach(item => {
                        const productCost = item.products?.cost_price || 0;
                        const quantity = item.quantity || 0;
                        cost += productCost * quantity;
                    });
                }
            });
        }
        
        const profit = revenue - cost;
        const profitMargin = revenue > 0 ? (profit / revenue * 100) : 0;

        // Update DOM elements
        const revenueEl = document.getElementById('totalRevenue');
        const costEl = document.getElementById('totalCost');
        const profitEl = document.getElementById('netProfit');
        const marginEl = document.getElementById('profitMargin');
        
        if (revenueEl) {
            revenueEl.textContent = `KES ${revenue.toFixed(2)}`;
        }
        if (costEl) {
            costEl.textContent = `KES ${cost.toFixed(2)}`;
        }
        if (profitEl) {
            profitEl.textContent = `KES ${profit.toFixed(2)}`;
            profitEl.style.color = profit >= 0 ? 'var(--success)' : 'var(--danger)';
        }
        if (marginEl) {
            marginEl.textContent = `Margin: ${profitMargin.toFixed(1)}%`;
            marginEl.style.color = profitMargin > 20 ? 'var(--success)' : profitMargin > 10 ? 'var(--warning)' : 'var(--danger)';
        }

        // Create/Update Profit Chart
        await createProfitChart(revenue, cost, profit);

        console.log(`✅ Revenue: KES ${revenue.toFixed(2)}, Cost: KES ${cost.toFixed(2)}, Profit: KES ${profit.toFixed(2)}`);
        
        return { revenue, cost, profit, profitMargin };

    } catch (error) {
        console.error('Profit & Loss error:', error);
        showToast('❌ Error loading profit data: ' + error.message, 'error');
    }
}
// ============================================================
//  CREATE PROFIT CHART
// ============================================================

async function createProfitChart(revenue, cost, profit) {
    try {
        const ctx = document.getElementById('profitChart');
        if (!ctx) {
            console.warn('Profit chart canvas not found');
            return;
        }

        if (profitChart) {
            profitChart.destroy();
            profitChart = null;
        }

        // Get theme colors
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        const textColor = isDark ? '#94A3B8' : '#475569';
        
        profitChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['Revenue', 'Cost', 'Profit'],
                datasets: [{
                    data: [revenue, cost, profit > 0 ? profit : 0],
                    backgroundColor: [
                        '#10B981',  // Green - Revenue
                        '#EF4444',  // Red - Cost
                        '#2563EB'   // Purple - Profit
                    ],
                    borderColor: [
                        '#059669',
                        '#DC2626',
                        '#1D4ED8'
                    ],
                    borderWidth: 2,
                    hoverOffset: 8
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                cutout: '65%',
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: {
                            color: textColor,
                            padding: 16,
                            usePointStyle: true,
                            pointStyle: 'circle',
                            font: {
                                size: 13,
                                weight: '600'
                            }
                        }
                    },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                let label = context.label || '';
                                let value = context.parsed || 0;
                                let total = context.dataset.data.reduce((a, b) => a + b, 0);
                                let percentage = total > 0 ? (value / total * 100).toFixed(1) : 0;
                                return `${label}: KES ${value.toFixed(2)} (${percentage}%)`;
                            }
                        }
                    }
                },
                animation: {
                    animateRotate: true,
                    duration: 800
                }
            }
        });
    } catch (error) {
        console.error('Profit chart error:', error);
    }
}

async function loadProfitBreakdown() {
    try {
        const { data: orders, error } = await supabaseClient
            .from('orders')
            .select('*, order_items(*, products(*))')
            .eq('status', 'paid')
            .order('created_at', { ascending: false });
            
        if (error || !orders || orders.length === 0) {
            const breakdownEl = document.getElementById('profitBreakdown');
            if (breakdownEl) {
                breakdownEl.innerHTML = `
                    <div class="empty-state" style="padding:20px;">
                        <i class="fas fa-inbox"></i>
                        <p>No paid orders yet</p>
                    </div>
                `;
            }
            return;
        }

        let totalRevenue = 0;
        let totalCost = 0;
        const items = [];

        orders.forEach(order => {
            const orderTotal = order.total || 0;
            totalRevenue += orderTotal;
            
            if (order.order_items) {
                order.order_items.forEach(item => {
                    const costPrice = item.products?.cost_price || 0;
                    const quantity = item.quantity || 0;
                    const itemCost = costPrice * quantity;
                    totalCost += itemCost;
                    
                    items.push({
                        name: item.products?.name || 'Unknown',
                        emoji: item.products?.emoji || '📦',
                        quantity: quantity,
                        unitPrice: item.unit_price || 0,
                        totalPrice: item.total || 0,
                        costPrice: costPrice,
                        totalCost: itemCost,
                        profit: (item.total || 0) - itemCost
                    });
                });
            }
        });

        const profit = totalRevenue - totalCost;
        const margin = totalRevenue > 0 ? (profit / totalRevenue * 100) : 0;

        // Update profit margin
        const marginEl = document.getElementById('profitMargin');
        if (marginEl) {
            marginEl.textContent = `Margin: ${margin.toFixed(1)}%`;
            marginEl.style.color = margin > 20 ? 'var(--success)' : margin > 10 ? 'var(--warning)' : 'var(--danger)';
        }

        // Show breakdown table
        let html = `
            <div class="table-wrapper">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>📦 Product</th>
                            <th>Qty</th>
                            <th>Revenue</th>
                            <th>Cost</th>
                            <th>Profit</th>
                            <th>Margin</th>
                        </tr>

let auditPage = 1;
let auditLimit = 20;
let auditTotalCount = 0;

async function loadAuditLogs(direction) {
    try {
        // Handle pagination
        if (direction === 'next') auditPage++;
        else if (direction === 'prev') auditPage = Math.max(1, auditPage - 1);
        
        // Get filter values
        const date = document.getElementById('auditDate')?.value;
        const action = document.getElementById('auditAction')?.value;
        const userRole = document.getElementById('auditUserRole')?.value;
        const userId = document.getElementById('auditUser')?.value;
        auditLimit = parseInt(document.getElementById('auditLimit')?.value) || 20;
        
        // Build query with all filters
        let query = supabaseClient
            .from('audit_logs')
            .select('*, users!inner(full_name, role_id, roles(name))', { count: 'exact' })
            .order('created_at', { ascending: false })
            .range((auditPage - 1) * auditLimit, auditPage * auditLimit - 1);
        
        // Apply filters
        if (date) {
            query = query.gte('created_at', date + 'T00:00:00')
                .lte('created_at', date + 'T23:59:59');
        }
        
        if (action) {
            query = query.eq('action', action);
        }
        
        if (userId) {
            query = query.eq('user_id', userId);
        }
        
        if (userRole) {
            query = query.eq('users.role_id', parseInt(userRole));
        }
        
        const { data: logs, error, count } = await query;
        auditTotalCount = count || 0;
        
        const table = document.getElementById('auditTable');
        const countEl = document.getElementById('auditCount');
        const pageEl = document.getElementById('auditPage');
        const totalEl = document.getElementById('auditTotalEvents');
        const todayEl = document.getElementById('auditTodayEvents');
        const uniqueEl = document.getElementById('auditUniqueUsers');
        const mostActiveEl = document.getElementById('auditMostActive');
        
        if (!table) return;
        
        // Update stats
        if (countEl) countEl.textContent = `${count || 0} logs found`;
        if (pageEl) pageEl.textContent = `Page ${auditPage}`;
        if (totalEl) totalEl.textContent = count || 0;
        
        // Calculate today's events
        const today = new Date().toISOString().split('T')[0];
        const todayCount = logs?.filter(l => l.created_at?.startsWith(today)).length || 0;
        if (todayEl) todayEl.textContent = todayCount;
        
        // Calculate unique users
        const uniqueUsers = new Set(logs?.map(l => l.user_id) || []);
        if (uniqueEl) uniqueEl.textContent = uniqueUsers.size;
        
        // Calculate most active user
        if (logs && logs.length > 0) {
            const userCounts = {};
            logs.forEach(l => {
                const name = l.users?.full_name || 'System';
                userCounts[name] = (userCounts[name] || 0) + 1;
            });
            const mostActive = Object.entries(userCounts).sort((a, b) => b[1] - a[1])[0];
            if (mostActiveEl) mostActiveEl.textContent = mostActive ? `${mostActive[0]} (${mostActive[1]})` : '—';
        }
        
        if (error || !logs?.length) {
            table.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-history"></i>
                    <p>No audit logs found</p>
                    <p style="font-size:12px;color:var(--text-muted);">${error?.message || 'Try adjusting your filters'}</p>
                </div>
            `;
            return;
        }
        
        // Build table with all details
        let html = `
            <div class="table-wrapper">

//  BULK PRODUCT IMPORT
// ============================================================
function importProducts() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.csv';
    input.onchange = async function(e) {
        const file = e.target.files[0];
        if (!file) return;
        
        const reader = new FileReader();
        reader.onload = async function(event) {
            try {
                const text = event.target.result;
                const lines = text.split('\n');
                
                let imported = 0;
                let errors = 0;
                
                for (let i = 1; i < lines.length; i++) {
                    if (!lines[i].trim()) continue;
                    const values = lines[i].split(',');
                    
                    try {
                        const product = {
                            name: values[0]?.trim() || 'Unknown',
                            product_type: values[1]?.trim() || 'butchery',
                            selling_price: parseFloat(values[2]) || 0,
                            cost_price: parseFloat(values[3]) || 0,
                            unit: values[4]?.trim() || 'KG',
                            stock_quantity: parseFloat(values[5]) || 0,
                            reorder_level: parseFloat(values[6]) || 0,
                            emoji: values[7]?.trim() || '📦',
                            is_active: true
                        };
                        
                        await supabaseClient.from('products').insert(product);
                        imported++;
                    } catch (err) {
                        errors++;
                        console.error('Import error for line', i, err);
                    }
                }
                
                showToast(`✅ Imported ${imported} products. ${errors} errors.`, 'success');
                addNotification('Products Imported', `${imported} products imported successfully.`, 'success', 'products');
                loadProducts();
                
            } catch (error) {
                console.error('Import error:', error);
                showToast('❌ Import failed: ' + error.message, 'error');
            }
        };
        reader.readAsText(file);
    };
    input.click();
}
