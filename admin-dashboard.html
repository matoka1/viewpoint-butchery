async function processPaymentPOS(method) {
    let userId = null;
    let userFullName = 'User';

    if (currentUser?.id) {
        userId = currentUser.id;
        userFullName = currentUser.full_name || 'User';
    } else {
        try {
            const stored = JSON.parse(localStorage.getItem('viewpoint_session') || 'null');
            if (stored?.user?.id) {
                userId = stored.user.id;
                userFullName = stored.user.full_name || stored.user.email?.split('@')[0] || 'User';
                currentUser = stored.user;
            }
        } catch (e) { console.error('Session restore failed:', e); }
    }
    if (!userId) {
        showToast('Please login again. Session expired.', 'error');
        setTimeout(() => { window.location.href = 'index.html'; }, 1500);
        return;
    }

    if (!cart.length) { showToast('Cart is empty!', 'warning'); return; }

    const rawSubtotal = cart.reduce((sum, item) => sum + Number(item.total || 0), 0);
    const discountInput = Number(document.getElementById('posDiscount')?.value || 0);
    const discount = Math.min(Math.max(0, discountInput), rawSubtotal);
    const total = Math.max(0, rawSubtotal - discount);
    const totalAmount = Math.round(total);
    const phoneInput = document.getElementById('mpesaPhone');
    const phone = phoneInput?.value?.trim() || '';

    if (method === 'mpesa') {
        const clean = phone.replace(/\s|-/g, '');
        if (!/^07\d{8}$|^01\d{8}$|^2547\d{8}$|^2541\d{8}$/.test(clean)) {
            showToast('Please enter a valid M-Pesa phone number', 'warning'); return;
        }
    }
    if (method === 'cash') {
        const received = Number(document.getElementById('cashReceived')?.value || 0);
        if (received < total) { showToast('Cash received is less than the total', 'warning'); return; }
    }
    if (method === 'mpesa' && totalAmount < 1) { showToast('M-Pesa amount must be at least KES 1', 'warning'); return; }

    const modal = document.getElementById('paymentModal');
    const content = document.getElementById('paymentContent');
    const title = document.getElementById('paymentModalTitle');
    if (!modal || !content) { showToast('Payment window is unavailable. Please refresh the page.', 'error'); return; }

    pendingPayment.isProcessing = true;
    pendingPayment.cancelled = false;
    pendingPayment.orderId = null;
    pendingPayment.paymentId = null;
    pendingPayment.transactionId = null;

    title.textContent = method === 'mpesa' ? '⏳ Processing M-Pesa Payment' : `⏳ Processing ${method.toUpperCase()} Payment`;
    content.innerHTML = `
        <div class="spinner"></div>
        <p class="status-text">${method === 'mpesa' ? 'Sending STK Push...' : 'Processing payment...'}</p>
        <p class="status-sub">Amount: KES ${total.toFixed(2)}</p>
        ${method === 'mpesa' ? '<p class="status-sub" style="margin-top:8px">📱 Check the customer phone and enter the M-Pesa PIN.</p><button id="activeCancelPayment" class="btn btn-danger" style="margin-top:14px;width:100%" onclick="cancelPayment()"><i class="fas fa-times"></i> Cancel Payment</button>' : ''}
    `;
    modal.classList.add('active');

    const items = cart.map(item => ({
        order_id: null,
        product_id: item.product_id,
        quantity: Number(item.quantity || item.qty || 0),
        unit_price: Number(item.unit_price || item.price || 0),
        total: Number(item.total || 0)
    }));

    let order = null;
    let payment = null;
    try {
        const { data: createdOrder, error: orderError } = await supabaseClient.from('orders').insert({
            order_type: posMode,
            user_id: userId,
            customer_phone: phone || null,
            subtotal: rawSubtotal,
            total,
            status: 'draft',
            payment_status: 'pending',
            payment_method: method
        }).select().single();
        if (orderError) throw new Error('Failed to create order: ' + orderError.message);
        order = createdOrder;
        pendingPayment.orderId = order.id;

        const orderItems = items.map(x => ({...x, order_id: order.id}));
        const { error: itemsError } = await supabaseClient.from('order_items').insert(orderItems);
        if (itemsError) throw new Error('Failed to save order items: ' + itemsError.message);

        const { data: createdPayment, error: paymentError } = await supabaseClient.from('payments').insert({
            order_id: order.id,
            payment_method: method,
            amount: total,
            status: 'pending'
        }).select().single();
        if (paymentError) throw new Error('Failed to create payment: ' + paymentError.message);
        payment = createdPayment;
        pendingPayment.paymentId = payment.id;

        if (phone) {
            try {
                const cleanPhone = phone.replace(/\s|-/g, '');
                const { data: existing } = await supabaseClient.from('customers').select('id').eq('phone', cleanPhone).maybeSingle();
                if (!existing) await supabaseClient.from('customers').insert({name: cleanPhone, phone: cleanPhone, loyalty_points: 10});
            } catch (e) { console.warn('Customer auto-save skipped:', e); }
        }

        if (pendingPayment.cancelled) {
            await cancelCreatedPayment(order.id, payment.id);
            return;
        }

        if (method === 'mpesa') {
            let formattedPhone = phone.replace(/\s|-/g, '');
            if (formattedPhone.startsWith('+254')) formattedPhone = formattedPhone.slice(1);
            else if (formattedPhone.startsWith('0')) formattedPhone = '254' + formattedPhone.slice(1);

            const reference = `ORDER-${String(order.id).slice(0,8).toUpperCase()}-${Date.now()}`;
            await supabaseClient.from('payments').update({transaction_reference: reference}).eq('id', payment.id);

            const { data: stkData, error: stkError } = await supabaseClient.functions.invoke('payhero', {
                body: {
                    action: 'stk_push', phone: formattedPhone, amount: totalAmount,
                    order_id: order.id, description: `Viewpoint Order #${order.order_number || String(order.id).slice(0,8)}`,
                    account_id: PAYHERO_CONFIG.accountId
                }
            });
            if (stkError) throw new Error('STK Push failed: ' + stkError.message);
            if (!stkData?.success) throw new Error(stkData?.message || 'STK Push failed');

            pendingPayment.transactionId = stkData.transaction_id || stkData.transaction_reference || reference;
            await supabaseClient.from('payments').update({transaction_reference: pendingPayment.transactionId}).eq('id', payment.id);

            let confirmed = false;
            let result = null;
            for (let attempt = 1; attempt <= 30; attempt++) {
                if (pendingPayment.cancelled) {
                    await cancelCreatedPayment(order.id, payment.id);
                    return;
                }
                await new Promise(r => setTimeout(r, 2000));
                if (pendingPayment.cancelled) {
                    await cancelCreatedPayment(order.id, payment.id);
                    return;
                }
                try {
                    const { data: statusData, error: statusError } = await supabaseClient.functions.invoke('payhero', {
                        body: {action: 'status', transaction_id: pendingPayment.transactionId}
                    });
                    if (!statusError && statusData?.success) {
                        const st = String(statusData.status || '').toLowerCase();
                        if (st === 'completed' || st === 'success' || st === 'paid') { confirmed = true; result = statusData; break; }
                        if (['failed','cancelled','canceled'].includes(st)) { result = statusData; break; }
                    }
                    if (content && !pendingPayment.cancelled) {
                        const remaining = Math.max(0, (30 - attempt) * 2);
                        content.innerHTML = `<div class="spinner"></div><p class="status-text">⏳ Waiting for M-Pesa confirmation...</p><p class="status-sub">Attempt ${attempt} of 30 · about ${remaining}s remaining</p><button class="btn btn-danger" style="margin-top:14px;width:100%" onclick="cancelPayment()"><i class="fas fa-times"></i> Cancel Payment</button>`;
                    }
                } catch (pollError) { console.warn('M-Pesa status check:', pollError); }
            }

            if (pendingPayment.cancelled) { await cancelCreatedPayment(order.id, payment.id); return; }
            if (confirmed) {
                await completeCreatedPayment(order, payment, orderItems, method, total, userFullName, result);
                return;
            }

            const failed = ['failed','cancelled','canceled'].includes(String(result?.status || '').toLowerCase());
            if (failed) {
                await failCreatedPayment(order.id, payment.id, result?.message || 'M-Pesa transaction was not completed');
            } else {
                await supabaseClient.from('orders').update({payment_status:'pending', status:'draft'}).eq('id', order.id);
                await supabaseClient.from('payments').update({status:'pending'}).eq('id', payment.id);
                showPaymentResult('⏳', 'Payment Still Pending', `Order #${order.order_number || String(order.id).slice(0,8)} remains pending. You can check it from Orders.`);
                showToast('Payment is still pending. Check the Orders section.', 'warning');
                setTimeout(() => { modal.classList.remove('active'); loadOrders(); loadDashboard(); }, 2500);
                pendingPayment.isProcessing = false;
            }
        } else {
            await completeCreatedPayment(order, payment, orderItems, method, total, userFullName, {
                receipt_number: method === 'cash' ? null : null
            });
            return;
        }
    } catch (error) {
        console.error('Payment error:', error);
        pendingPayment.isProcessing = false;
        if (payment?.id) await supabaseClient.from('payments').update({status:'failed'}).eq('id', payment.id).catch(()=>{});
        if (order?.id) await supabaseClient.from('orders').update({status:'cancelled', payment_status:'failed'}).eq('id', order.id).catch(()=>{});
        showPaymentResult('❌', 'Payment Error', error.message || 'Could not process the payment.');
        showToast('Payment error: ' + (error.message || 'Unknown error'), 'error');
        if (typeof addNotification === 'function') addNotification('Payment Error', error.message || 'Unknown payment error', 'error');
    }
}

async function cancelCreatedPayment(orderId, paymentId) {
    try {
        if (paymentId) await supabaseClient.from('payments').update({status:'cancelled'}).eq('id', paymentId);
        if (orderId) await supabaseClient.from('orders').update({status:'cancelled', payment_status:'cancelled'}).eq('id', orderId);
    } catch (e) { console.error('Cancel update failed:', e); }
    pendingPayment.isProcessing = false;
    showPaymentResult('⛔', 'Payment Cancelled', 'The payment request was cancelled. No sale was completed.');
    showToast('Payment cancelled', 'warning');
    setTimeout(() => document.getElementById('paymentModal')?.classList.remove('active'), 1200);
}

async function failCreatedPayment(orderId, paymentId, message) {
    await supabaseClient.from('payments').update({status:'failed'}).eq('id', paymentId).catch(()=>{});
    await supabaseClient.from('orders').update({status:'cancelled', payment_status:'failed'}).eq('id', orderId).catch(()=>{});
    pendingPayment.isProcessing = false;
    showPaymentResult('❌', 'Payment Failed', message || 'Transaction was not completed.');
    showToast('Payment failed. Please try again.', 'error');
    setTimeout(() => document.getElementById('paymentModal')?.classList.remove('active'), 1800);
}

async function completeCreatedPayment(order, payment, orderItems, method, total, userFullName, paymentData) {
    const completedAt = new Date().toISOString();
    const receiptNumber = paymentData?.receipt_number || paymentData?.mpesa_receipt_number || null;
    const { error: payUpdateError } = await supabaseClient.from('payments').update({status:'completed', completed_at:completedAt}).eq('id', payment.id);
    if (payUpdateError) throw new Error('Payment was received but could not be recorded: ' + payUpdateError.message);
    const { error: orderUpdateError } = await supabaseClient.from('orders').update({status:'paid', payment_status:'completed', completed_at:completedAt}).eq('id', order.id);
    if (orderUpdateError) throw new Error('Payment was received but order status could not be updated: ' + orderUpdateError.message);

    if (method === 'mpesa') {
        await supabaseClient.from('mpesa_transactions').insert({
            payment_id: payment.id, order_id: order.id,
            phone_number: document.getElementById('mpesaPhone')?.value?.trim() || order.customer_phone,
            amount: total, mpesa_receipt_number: receiptNumber,
            transaction_reference: pendingPayment.transactionId,
            result_code: 0, result_description: 'Success', status: 'completed', created_at: completedAt
        }).catch(e => console.warn('M-Pesa transaction log:', e));
    }

    for (const item of orderItems) {
        try {
            const { data: product } = await supabaseClient.from('products').select('stock_quantity').eq('id', item.product_id).single();
            if (product) {
                const newStock = Math.max(0, Number(product.stock_quantity || 0) - Number(item.quantity || 0));
                await supabaseClient.from('products').update({stock_quantity:newStock}).eq('id', item.product_id);
            }
        } catch (e) { console.warn('Stock update:', e); }
    }

    await logUserActivity('Payment Processed', `${method.toUpperCase()} payment of KES ${total.toFixed(2)} completed by ${userFullName}`, 'payment', payment.id, {amount:total, method, receipt:receiptNumber}).catch(()=>{});
    pendingPayment.isProcessing = false;
    showPaymentResult('✅', 'Payment Successful', `Order #${order.order_number || String(order.id).slice(0,8)} · KES ${total.toFixed(2)}${receiptNumber ? ' · Receipt: '+receiptNumber : ''}`);
    showToast('Payment successful!', 'success');
    if (typeof addNotification === 'function') addNotification('Payment Successful', `Order #${order.order_number || String(order.id).slice(0,8)} · KES ${total.toFixed(2)}`, 'success', 'orders');

    // Clear BOTH cart stores before closing the payment flow, preventing the old cart from making the sale appear stuck.
    cart = [];
    if (typeof window.clearUltimateCartState === 'function') window.clearUltimateCartState();
    const discount = document.getElementById('posDiscount'); if (discount) discount.value = '0';
    const cash = document.getElementById('cashReceived'); if (cash) cash.value = '';
    const mpesa = document.getElementById('mpesaPhone'); if (mpesa) mpesa.value = '';
    updateCartDisplayPOS();
    loadPOSProducts(posMode);
    loadDashboard();
    loadOrders();
    resetSessionTimer();

    // Generate the receipt immediately after the database is confirmed, not before.
    setTimeout(async () => {
        document.getElementById('paymentModal')?.classList.remove('active');
        await generateAdminReceipt(order.id);
    }, 700);
}

function showPaymentResult(icon, title, sub) {
    const content = document.getElementById('paymentContent');
    if (!content) return;
    content.innerHTML = `<div class="status-icon">${icon}</div><p class="status-text">${escapeHtmlSimple(title)}</p><p class="status-sub">${escapeHtmlSimple(sub)}</p>`;
}
function escapeHtmlSimple(v) { return String(v ?? '').replace(/[&<>'"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[m])); }

function cancelPayment() {
    if (!pendingPayment.isProcessing) {
        document.getElementById('paymentModal')?.classList.remove('active');
        return;
    }
    // Do not merely close the modal. The polling process watches this flag and will cancel the DB records.
    pendingPayment.cancelled = true;
    const btn = document.getElementById('activeCancelPayment');
    if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Cancelling...'; }
    const content = document.getElementById('paymentContent');
    if (content) content.innerHTML = '<div class="status-icon">⛔</div><p class="status-text">Cancelling payment...</p><p class="status-sub">Please wait while the transaction is closed safely.</p>';
}

function initSidebar() {

(function(){

  const money=n=>'KES '+Number(n||0).toLocaleString('en-KE',{minimumFractionDigits:2,maximumFractionDigits:2});
  const esc=x=>String(x??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));

  function legacyToState(){
    state.cart=(Array.isArray(window.cart)?window.cart:[]).map(x=>({
      id:x.product_id||x.id,name:x.name,price:Number(x.unit_price||x.price||0),qty:Number(x.quantity||x.qty||0),
      emoji:x.emoji||'',unit:x.unit||'',sku:x.sku||'',barcode:x.barcode||''
    }));
  }
  function stateToLegacy(){
    window.cart=state.cart.map(x=>({product_id:x.id,id:x.id,name:x.name,quantity:Number(x.qty||0),qty:Number(x.qty||0),unit_price:Number(x.price||0),price:Number(x.price||0),total:Number(x.price||0)*Number(x.qty||0),emoji:x.emoji||'',unit:x.unit||'',sku:x.sku||'',barcode:x.barcode||''}));
  }
  function cartTotal(){return state.cart.reduce((a,x)=>a+(Number(x.price)||0)*(Number(x.qty)||0),0)}
  function discountValue(){const sub=cartTotal();return Math.min(Math.max(0,Number(document.getElementById('posDiscount')?.value||0)),sub)}

  window.syncUltimateCartFromLegacy=function(items){
    state.cart=(items||[]).map(x=>({id:x.product_id||x.id,name:x.name,price:Number(x.unit_price||x.price||0),qty:Number(x.quantity||x.qty||0),emoji:x.emoji||'',unit:x.unit||'',sku:x.sku||'',barcode:x.barcode||''}));
    save(); renderCart();
  };
  window.clearUltimateCartState=function(){state.cart=[];save();renderCart();};
  window.addUltimateCartItem=function(p){
    const i=state.cart.findIndex(x=>String(x.id)===String(p.id));
    const qty=Number(p.qty||p.quantity||1);
    if(i>=0)state.cart[i].qty=Number(state.cart[i].qty)+qty;else state.cart.push({...p,qty});
    stateToLegacy();save();renderCart();updateCartDisplayPOS();
  };
  window.changeCartQty=function(id,d){
    const i=state.cart.findIndex(x=>String(x.id)===String(id));if(i<0)return;
    state.cart[i].qty=Number(state.cart[i].qty)+Number(d);
    if(state.cart[i].qty<=0)state.cart.splice(i,1);

  };
  function renderCart(){
    const box=document.getElementById('ultimateCartItems');if(!box)return;
    if(!state.cart.length){box.innerHTML='<div class="empty-state" style="padding:25px 10px"><i class="fas fa-shopping-basket"></i><p>Cart is empty</p></div>'}
    else box.innerHTML=state.cart.map(x=>`<div class="cart-row"><div><div class="name">${esc(x.name)}</div><div class="meta">${money(x.price)} × ${Number(x.qty).toFixed(3)} ${esc(x.unit||'')}</div></div><div class="qty-control"><button type="button" onclick="changeCartQty('${esc(x.id)}',-1)">−</button><span>${Number(x.qty).toFixed(3)}</span><button type="button" onclick="changeCartQty('${esc(x.id)}',1)">+</button></div></div>`).join('');

  window.completeUltimateSale=function(){

  window.holdCurrentSale=function(){if(!state.cart.length)return toast('Cart is empty','warning');state.held.push({id:'H-'+Date.now(),createdAt:new Date().toISOString(),items:state.cart,total:cartTotal()});window.cart=[];state.cart=[];save();renderCart();renderHeld();toast('Sale held successfully','success');};
  function renderHeld(){const box=document.getElementById('heldSalesList');if(!box)return;const hc=document.getElementById('heldCount'),lh=document.getElementById('liveHeldCount');if(hc)hc.textContent=state.held.length;if(lh)lh.textContent=state.held.length;box.innerHTML=state.held.length?state.held.map(x=>`<div class="alert-item" style="margin-bottom:8px"><div><strong>${esc(x.id)}</strong><div style="font-size:11px;color:var(--text-muted)">${new Date(x.createdAt).toLocaleString()} · ${x.items.length} items</div></div><div><strong>${money(x.total)}</strong><button class="btn btn-sm btn-primary" style="margin-left:8px" onclick="resumeHeld('${esc(x.id)}')">Resume</button></div></div>`).join(''):'<div class="empty-state"><p>No held sales</p></div>';}
  window.resumeHeld=function(id){let i=state.held.findIndex(x=>x.id===id);if(i<0)return;if(state.cart.length&&!confirm('Current cart is not empty. Replace it?'))return;state.cart=state.held[i].items||[];state.held.splice(i,1);stateToLegacy();save();renderCart();renderHeld();closeModal('heldSalesModal');toast('Sale resumed','success');};

  window.renderExpenses=function(){const box=document.getElementById('expensesTable');if(!box)return;const q=(document.getElementById('expenseSearch')?.value||'').toLowerCase(),cat=document.getElementById('expenseCategory')?.value||'';const a=state.expenses.filter(x=>(!cat||x.category===cat)&&(!q||(x.category+' '+x.description).toLowerCase().includes(q)));box.innerHTML=a.length?`<div class="table-wrapper"><table class="data-table"><thead><tr><th>Date</th><th>Category</th><th>Description</th><th>Amount</th></tr></thead><tbody>${a.map(x=>`<tr><td>${new Date(x.date).toLocaleString()}</td><td>${esc(x.category)}</td><td>${esc(x.description||'—')}</td><td><strong>${money(x.amount)}</strong></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty-state"><p>No expenses recorded</p></div>';const ec=document.getElementById('expenseCount');if(ec)ec.textContent=state.expenses.length;const today=state.expenses.filter(x=>new Date(x.date).toDateString()===new Date().toDateString()).reduce((a,x)=>a+Number(x.amount||0),0);const te=document.getElementById('todayExpenses');if(te)te.textContent=money(today);};
  window.startUltimateShift=e=>{e.preventDefault();if(state.shift)return alert('A shift is already open.');state.shift={id:'SHIFT-'+Date.now(),openedAt:new Date().toISOString(),openingCash:Number(document.getElementById('openingCash').value),till:document.getElementById('shiftTill').value,sales:0,cashSales:0};save();closeModal('shiftModal');renderShift();toast('Shift opened','success');};

  function renderShift(){const open=state.shift,s=document.getElementById('shiftStatusText'),b=document.getElementById('shiftActionBtn'),l=document.getElementById('liveShiftState'),p=document.getElementById('currentShiftPanel');if(s)s.textContent=open?'Open · '+open.till:'No active shift';if(b)b.textContent=open?'Close Shift':'Open Shift';if(l)l.textContent=open?'Yes':'No';if(p)p.innerHTML=open?`<div class="module-stat"><div class="l">Opening Cash</div><div class="v">${money(open.openingCash)}</div></div><div class="module-stat"><div class="l">Shift Sales</div><div class="v">${money(open.sales||0)}</div></div><div class="module-stat"><div class="l">Opened</div><div class="v" style="font-size:15px">${new Date(open.openedAt).toLocaleString()}</div></div>`:'<div class="module-stat"><div class="l">Status</div><div class="v">Closed</div></div>';}
  function renderCloseSummary(){const o=state.shift||{},e=document.getElementById('shiftCloseSummary');if(e)e.innerHTML=`<div class="alert-box" style="margin-bottom:12px"><div class="summary-line"><span>Opening cash</span><strong>${money(o.openingCash)}</strong></div><div class="summary-line"><span>Recorded sales</span><strong>${money(o.sales||0)}</strong></div><div class="summary-line"><span>Expected cash</span><strong>${money((o.openingCash||0)+(o.cashSales||0))}</strong></div></div>`;}

    <!-- Auth Check -->
    <script>
        (function() {
            'use strict';
            
            const SESSION_KEY = 'viewpoint_session';
            const LOGIN_URL = 'index.html';
            
            function checkAuth() {
                try {
                    const stored = localStorage.getItem(SESSION_KEY);
                    if (!stored) {
                        console.log('No session found, redirecting to login...');
                        window.location.href = LOGIN_URL;
                        return;
                    }
                    
                    const session = JSON.parse(stored);
                    if (!session || !session.user) {
                        localStorage.removeItem(SESSION_KEY);
                        window.location.href = LOGIN_URL;
                        return;
                    }
                    
                    const maxAge = 24 * 60 * 60 * 1000;
                    if (Date.now() - session.loginTime > maxAge) {
                        localStorage.removeItem(SESSION_KEY);
                        window.location.href = LOGIN_URL;
                        return;
                    }
                    
                    console.log('✅ Authenticated as:', session.user.email);
                    
                    const userNameEl = document.getElementById('userName');
                    const userRoleEl = document.querySelector('.user-role');
                    const userAvatar = document.getElementById('userAvatar');
                    
                    if (userNameEl) {
                        userNameEl.textContent = session.user.full_name || session.user.email.split('@')[0];
                    }
                    
                    if (userRoleEl) {
                        userRoleEl.textContent = session.user.roles?.name || 'Cashier';
                    }
                    
                    if (userAvatar) {
                        const name = session.user.full_name || session.user.email || 'User';
                        userAvatar.textContent = name.charAt(0).toUpperCase();
                    }
                    
                } catch (e) {
                    console.error('Auth check error:', e);
                    localStorage.removeItem(SESSION_KEY);
                    window.location.href = LOGIN_URL;
                }
            }
            
            window.logout = function() {
                localStorage.removeItem(SESSION_KEY);
                if (typeof supabase !== 'undefined' && supabase.auth) {
                    supabase.auth.signOut().catch(() => {});
                }
                window.location.href = LOGIN_URL;
            };
            
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', checkAuth);
            } else {
                checkAuth();
            }
            
            document.addEventListener('DOMContentLoaded', function() {
                const logoutBtn = document.getElementById('logoutBtn');
                if (logoutBtn) {
                    logoutBtn.addEventListener('click', function(e) {
                        e.preventDefault();
                        if (confirm('Are you sure you want to logout?')) {
                            window.logout();
                        }
                    });
                }
            });
            
        })();
    </script>
