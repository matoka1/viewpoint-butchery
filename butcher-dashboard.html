<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Butcher Dashboard - Viewpoint</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #8B0000;
            --success: #28a745;
            --warning: #ffc107;
            --shadow: 0 4px 6px rgba(0,0,0,0.1);
            --radius: 12px;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; }
        
        .dashboard { display: flex; min-height: 100vh; }
        .sidebar {
            width: 200px;
            background: #1a1a2e;
            color: white;
            padding: 20px 0;
            position: fixed;
            height: 100vh;
        }
        .sidebar-brand {
            padding: 0 20px 20px;
            font-size: 20px;
            font-weight: bold;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 20px;
        }
        .sidebar-brand i { color: #e94560; margin-right: 10px; }
        .sidebar-menu { list-style: none; padding: 0; }
        .sidebar-menu li {
            padding: 14px 20px;
            cursor: pointer;
            transition: all 0.3s;
            border-left: 3px solid transparent;
        }
        .sidebar-menu li:hover, .sidebar-menu li.active {
            background: rgba(255,255,255,0.1);
            border-left-color: #e94560;
        }
        .sidebar-menu li i { margin-right: 10px; width: 20px; }
        #logoutBtn { margin-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); }
        
        .main-content { margin-left: 200px; flex: 1; padding: 20px; }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 20px;
        }
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        .user-info { display: flex; align-items: center; gap: 15px; }
        
        .filter-tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .filter-btn {
            padding: 8px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        .filter-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        .filter-btn:hover:not(.active) { background: #f0f0f0; }
        
        .orders-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .order-card {
            background: white;
            padding: 20px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            transition: all 0.3s;
        }
        .order-card:hover { transform: translateY(-3px); box-shadow: 0 6px 12px rgba(0,0,0,0.15); }
        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .order-number { font-weight: bold; color: var(--primary); font-size: 18px; }
        .status-badge {
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-badge.paid { background: #d4edda; color: #155724; }
        .status-badge.preparing { background: #fff3cd; color: #856404; }
        .status-badge.ready { background: #cce5ff; color: #004085; }
        .status-badge.completed { background: #d1ecf1; color: #0c5460; }
        
        .order-items { margin: 10px 0; }
        .order-item-detail {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .order-meta { font-size: 13px; color: var(--gray); margin-top: 10px; }
        
        .order-actions { display: flex; gap: 8px; margin-top: 15px; }
        .order-actions button {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-prepare { background: var(--warning); color: #333; }
        .btn-ready { background: var(--success); color: white; }
        .btn-complete { background: #17a2b8; color: white; }
        .order-actions button:hover { opacity: 0.8; }
        
        @media (max-width: 768px) {
            .sidebar { width: 60px; }
            .sidebar-brand span, .sidebar-menu li span { display: none; }
            .main-content { margin-left: 60px; }
            .orders-grid { grid-template-columns: 1fr; }
        }
        
        .empty-state { text-align: center; padding: 40px; color: var(--gray); }
        .empty-state i { font-size: 48px; margin-bottom: 15px; opacity: 0.5; }
    </style>
</head>
<body>
    <div class="dashboard">
        <nav class="sidebar">
            <div class="sidebar-brand"><i class="fas fa-store"></i><span>Viewpoint</span></div>
            <ul class="sidebar-menu">
                <li class="active" data-section="orders"><i class="fas fa-clipboard-list"></i><span>Orders</span></li>
                <li id="logoutBtn"><i class="fas fa-sign-out-alt"></i><span>Logout</span></li>
            </ul>
        </nav>

        <div class="main-content">
            <div class="top-bar">
                <div><h2><i class="fas fa-drumstick-bite"></i> Butchery Orders</h2></div>
                <div class="user-info">
                    <span id="currentTime"></span>
                    <div class="avatar" id="userAvatar">B</div>
                    <span id="userName">Butcher</span>
                </div>
            </div>

            <div class="filter-tabs">
                <button class="filter-btn active" data-status="all">All Orders</button>
                <button class="filter-btn" data-status="paid">New</button>
                <button class="filter-btn" data-status="preparing">Preparing</button>
                <button class="filter-btn" data-status="ready">Ready</button>
                <button class="filter-btn" data-status="completed">Completed</button>
            </div>

            <div id="ordersGrid" class="orders-grid">
                <div class="empty-state">
                    <i class="fas fa-inbox"></i>
                    <p>No orders to display</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ===== CONFIG =====
        const SUPABASE_CONFIG = {
            url: 'https://sipgnykshaxrxwdeswfc.supabase.co',
            anonKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNpcGdueWtzaGF4cnh3ZGVzd2ZjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4OTA2MzMsImV4cCI6MjEwMjQ2NjYzM30.xJtq_3jNMLnXCyVSurdIuUnrlmZEyMWNO1-Azk_4k2E'
        };

        const supabase = supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey);
        let currentUser = null;
        let currentFilter = 'all';

        // ===== AUTH =====
        async function checkAuth() {
            const stored = localStorage.getItem('viewpoint_session');
            if (!stored) { window.location.href = '/'; return null; }
            const { user } = JSON.parse(stored);
            currentUser = user;
            document.getElementById('userAvatar').textContent = user.full_name.charAt(0).toUpperCase();
            document.getElementById('userName').textContent = user.full_name;
            return user;
        }

        // ===== LOAD ORDERS =====
        async function loadOrders(filter = 'all') {
            currentFilter = filter;
            
            let query = supabase
                .from('orders')
                .select(`
                    *,
                    order_items(
                        *,
                        products(*)
                    )
                `)
                .eq('order_type', 'butchery')
                .eq('payment_status', 'completed')
                .order('created_at', { ascending: false });
            
            if (filter !== 'all') {
                query = query.eq('status', filter);
            }
            
            const { data: orders, error } = await query;
            
            const grid = document.getElementById('ordersGrid');
            if (error || !orders?.length) {
                grid.innerHTML = `
                    <div class="empty-state" style="grid-column:1/-1;">
                        <i class="fas fa-inbox"></i>
                        <p>No ${filter === 'all' ? '' : filter} orders</p>
                    </div>
                `;
                return;
            }
            
            grid.innerHTML = orders.map(order => {
                const items = order.order_items || [];
                const totalQty = items.reduce((sum, item) => sum + item.quantity, 0);
                
                return `
                    <div class="order-card">
                        <div class="order-header">
                            <span class="order-number">#${order.order_number || order.id.slice(0, 8)}</span>
                            <span class="status-badge ${order.status}">${order.status.toUpperCase()}</span>
                        </div>
                        <div class="order-items">
                            ${items.map(item => `
                                <div class="order-item-detail">
                                    <span>${item.products?.name || 'Unknown'}</span>
                                    <span>${item.quantity.toFixed(3)} ${item.products?.unit || 'KG'}</span>
                                    <span>KES ${item.total.toFixed(2)}</span>
                                </div>
                            `).join('')}
                        </div>
                        <div class="order-meta">
                            <span>Total: <strong>KES ${order.total.toFixed(2)}</strong></span>
                            <span style="margin-left:15px;">${new Date(order.created_at).toLocaleTimeString()}</span>
                        </div>
                        <div class="order-actions">
                            ${order.status === 'paid' ? `
                                <button class="btn-prepare" onclick="updateOrderStatus('${order.id}', 'preparing')">
                                    <i class="fas fa-cut"></i> Prepare
                                </button>
                            ` : ''}
                            ${order.status === 'preparing' ? `
                                <button class="btn-ready" onclick="updateOrderStatus('${order.id}', 'ready')">
                                    <i class="fas fa-check"></i> Ready
                                </button>
                            ` : ''}
                            ${order.status === 'ready' ? `
                                <button class="btn-complete" onclick="updateOrderStatus('${order.id}', 'completed')">
                                    <i class="fas fa-flag-checkered"></i> Complete
                                </button>
                            ` : ''}
                            ${order.status === 'completed' ? `
                                <span style="color:var(--success);padding:8px;text-align:center;">
                                    <i class="fas fa-check-circle"></i> Done
                                </span>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ===== UPDATE ORDER STATUS =====
        async function updateOrderStatus(orderId, status) {
            try {
                const { error } = await supabase
                    .from('orders')
                    .update({ status: status, updated_at: new Date().toISOString() })
                    .eq('id', orderId);
                
                if (error) throw error;
                
                // Refresh orders
                await loadOrders(currentFilter);
            } catch (error) {
                alert('Error updating order: ' + error.message);
            }
        }

        // ===== FILTER TABS =====
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                loadOrders(btn.dataset.status);
            });
        });

        // ===== LOGOUT =====
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await supabase.auth.signOut();
            localStorage.removeItem('viewpoint_session');
            window.location.href = '/';
        });

        // ===== CLOCK =====
        setInterval(() => {
            document.getElementById('currentTime').textContent = new Date().toLocaleTimeString();
        }, 1000);

        // ===== REAL-TIME UPDATES =====
        function setupRealtime() {
            supabase
                .channel('orders-channel')
                .on(
                    'postgres_changes',
                    { event: '*', schema: 'public', table: 'orders' },
                    () => { loadOrders(currentFilter); }
                )
                .subscribe();
        }

        // ===== INIT =====
        document.addEventListener('DOMContentLoaded', async () => {
            await checkAuth();
            await loadOrders('all');
            setupRealtime();
        });
    </script>
</body>
</html>
